name: כתבת יום ראשון — טור יזמות נדל"ן

on:
  schedule:
    # 05:00 UTC = 08:00 בישראל (שעון קיץ). בחורף שנו ל-'0 6 * * 0'.
    - cron: '0 5 * * 0'
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מכפתור ב-Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת תלות
        run: npm install @anthropic-ai/sdk

      - name: ייצור כתבת השבוע
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node yazamut_nadlan/scripts/generate-article.mjs

      - name: פרסום אוטומטי — דחיפה ל-main
        run: |
          git config user.name "Kurkoos Content Bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/yazamut
          if git diff --staged --quiet; then echo "אין כתבה חדשה — מדלג."; exit 0; fi
          git commit -m 'טור יזמות נדל"ן — כתבת השבוע (אוטומטי)'
          git push origin HEAD:main
