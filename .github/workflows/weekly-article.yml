name: כתבת יום ראשון — טור יזמות נדל"ן

on:
  schedule:
    # 05:00 UTC = 08:00 בישראל (שעון קיץ). בחורף שנו ל-'0 6 * * 0'.
    - cron: '0 5 * * 0'
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מכפתור ב-Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת תלות
        run: npm install @anthropic-ai/sdk

      - name: ייצור כתבת השבוע
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node yazamut_nadlan/scripts/generate-article.mjs

      # פותח PR לבדיקה אנושית לפני פרסום (מומלץ בהתחלה).
      # רוצים פרסום אוטומטי מלא? החליפו את הצעד הזה ב-git commit + git push ל-main.
      - name: פתיחת Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'טור יזמות נדל"ן — כתבת השבוע'
          title: 'טור יזמות נדל"ן — כתבת השבוע'
          body: |
            כתבה שבועית חדשה נוצרה אוטומטית.
            בדקו את התוכן והתמונה, ואז מזגו כדי לפרסם.
          branch: weekly/yazamut-article
          add-paths: |
            src/content/yazamut/*.js
