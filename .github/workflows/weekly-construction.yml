name: כתבת יום ראשון — המדריך לתהליך הבנייה

on:
  schedule:
    # 05:10 UTC בכל יום ראשון (בהפרש קל מטור היזמות כדי לא להתנגש).
    - cron: '10 5 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת תלות
        run: npm install @anthropic-ai/sdk

      - name: ייצור כתבת השבוע
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node constructions/scripts/generate-article.mjs

      - name: פתיחת Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'המדריך לתהליך הבנייה — כתבת השבוע'
          title: 'המדריך לתהליך הבנייה — כתבת השבוע'
          body: |
            כתבת ביצוע שבועית חדשה נוצרה אוטומטית.
            בדקו את התוכן והתמונה, ואז מזגו כדי לפרסם.
          branch: weekly/construction-article
          add-paths: |
            src/content/constructions/*.js
