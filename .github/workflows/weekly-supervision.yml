name: כתבת יום ראשון — פיקוח פרויקטים

on:
  schedule:
    # 05:20 UTC בכל יום ראשון (בהפרש קל מהטורים האחרים).
    - cron: '20 5 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת תלות
        run: npm install @anthropic-ai/sdk

      - name: ייצור כתבת השבוע
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node construction_supervision/scripts/generate-article.mjs

      - name: פתיחת Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'פיקוח פרויקטים — כתבת השבוע'
          title: 'פיקוח פרויקטים — כתבת השבוע'
          body: |
            כתבת פיקוח שבועית חדשה נוצרה אוטומטית.
            בדקו את התוכן והתמונה, ואז מזגו כדי לפרסם.
          branch: weekly/supervision-article
          add-paths: |
            src/content/supervision/*.js
