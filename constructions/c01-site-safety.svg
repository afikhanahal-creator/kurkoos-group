<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="שער אתר נעול בשרשרת עם צו סגירה ואפוד בטיחות ריק תלוי">
<!-- KURKOOS PALETTE: ink #16202E | paper #F5F2EC | brass #C9A24B | stone #9A9486 | line #2C3A4D -->
<rect width="1600" height="900" fill="#16202E"/>
<g stroke="#2C3A4D" stroke-width="1" opacity="0.16">
<line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="750" x2="1600" y2="750"/>
<line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/><line x1="1400" y1="0" x2="1400" y2="900"/>
</g>
<line x1="0" y1="772" x2="1600" y2="772" stroke="#C9A24B" stroke-width="3"/>
<!-- locked site gate -->
<g>
<rect x="250" y="300" width="36" height="472" fill="#F5F2EC" opacity="0.9"/>
<rect x="604" y="300" width="36" height="472" fill="#F5F2EC" opacity="0.9"/>
<rect x="250" y="300" width="390" height="30" fill="#F5F2EC" opacity="0.9"/>
<!-- chain -->
<g stroke="#9A9486" stroke-width="9" fill="none" opacity="0.95">
<path d="M286 520 q40 -26 80 0 q40 26 80 0 q40 -26 80 0 q38 24 78 2"/>
</g>
<!-- padlock -->
<g transform="translate(445,540)">
<rect x="-34" y="0" width="68" height="58" rx="9" fill="#C9A24B"/>
<path d="M-20 0 v-18 a20 20 0 0 1 40 0 v18" fill="none" stroke="#C9A24B" stroke-width="9"/>
<circle cx="0" cy="26" r="7" fill="#16202E"/>
</g>
<!-- closure notice -->
<g transform="translate(300,350)">
<rect x="0" y="0" width="190" height="120" rx="6" fill="#F5F2EC"/>
<rect x="0" y="0" width="190" height="34" fill="#b4452f"/>
<text x="95" y="25" text-anchor="middle" direction="rtl" fill="#fff" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" font-size="20">צו סגירה</text>
<g stroke="#9A9486" stroke-width="3" opacity="0.6"><line x1="18" y1="58" x2="172" y2="58"/><line x1="18" y1="78" x2="172" y2="78"/><line x1="18" y1="98" x2="120" y2="98"/></g>
</g>
</g>
<!-- empty safety vest on a hook (absent safety assistant) -->
<g transform="translate(1040,360)">
<line x1="0" y1="-80" x2="0" y2="-30" stroke="#9A9486" stroke-width="6"/>
<path d="M0 -34 q-26 6 -26 30" fill="none" stroke="#9A9486" stroke-width="6"/>
<!-- vest body -->
<path d="M-110 -8 L-70 -34 L-26 -8 L26 -8 L70 -34 L110 -8 L110 230 L-110 230 Z" fill="#C9A24B"/>
<!-- neck opening -->
<path d="M-26 -8 L0 40 L26 -8 Z" fill="#16202E"/>
<line x1="0" y1="40" x2="0" y2="230" stroke="#16202E" stroke-width="6"/>
<!-- reflective stripes -->
<rect x="-110" y="70" width="220" height="22" fill="#F5F2EC"/>
<rect x="-110" y="150" width="220" height="22" fill="#F5F2EC"/>
<text x="0" y="285" text-anchor="middle" direction="rtl" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="600" font-size="22">עוזר בטיחות · המשרה שפקעה</text>
</g>
<!-- 47 stark number -->
<text x="1480" y="240" text-anchor="end" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" font-size="150">47</text>
<text x="1480" y="285" text-anchor="end" direction="rtl" fill="#C9A24B" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="24">הרוגים בענף הבנייה · 2025</text>
<text x="1480" y="850" text-anchor="end" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" letter-spacing="6" font-size="30">KURKOOS</text>
</svg>
