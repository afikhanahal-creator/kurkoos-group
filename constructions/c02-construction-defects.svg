<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="חתך בניין עם תקופות הבדק לכל רכיב, חיפוי חוץ שבע שנים ואיטום ארבע שנים">
<!-- KURKOOS PALETTE: ink #16202E | paper #F5F2EC | brass #C9A24B | stone #9A9486 | line #2C3A4D -->
<rect width="1600" height="900" fill="#16202E"/>
<g stroke="#2C3A4D" stroke-width="1" opacity="0.16">
<line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="750" x2="1600" y2="750"/>
<line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/><line x1="1400" y1="0" x2="1400" y2="900"/>
</g>
<line x1="0" y1="800" x2="1600" y2="800" stroke="#C9A24B" stroke-width="3"/>
<!-- building cross-section -->
<g>
<!-- roof -->
<rect x="300" y="150" width="340" height="40" fill="#9A9486"/>
<!-- body -->
<rect x="300" y="190" width="340" height="610" fill="#F5F2EC" opacity="0.95"/>
<!-- floor lines -->
<g stroke="#9A9486" stroke-width="2" opacity="0.45">
<line x1="300" y1="320" x2="640" y2="320"/><line x1="300" y1="450" x2="640" y2="450"/><line x1="300" y1="580" x2="640" y2="580"/><line x1="300" y1="710" x2="640" y2="710"/>
</g>
<!-- facade stone seam (left edge) -->
<rect x="300" y="190" width="26" height="610" fill="#C9A24B" opacity="0.85"/>
<!-- a crack on facade -->
<path d="M470 200 L455 290 L500 350 L460 450 L505 540 L470 650" fill="none" stroke="#16202E" stroke-width="5" stroke-linejoin="round"/>
</g>
<!-- year badges with leader lines -->
<g font-family="Heebo,Assistant,Segoe UI,sans-serif">
<!-- roof / איטום 4 -->
<line x1="640" y1="170" x2="780" y2="170" stroke="#F5F2EC" stroke-width="2" opacity="0.5"/>
<circle cx="838" cy="170" r="44" fill="#C9A24B"/><text x="838" y="186" text-anchor="middle" fill="#16202E" font-weight="800" font-size="40">4</text>
<text x="900" y="178" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="30">גג ואיטום</text>
<!-- facade / חיפוי 7 (emphasized) -->
<line x1="326" y1="380" x2="780" y2="380" stroke="#F5F2EC" stroke-width="2" opacity="0.5"/>
<circle cx="848" cy="380" r="60" fill="#C9A24B"/><text x="848" y="402" text-anchor="middle" fill="#16202E" font-weight="800" font-size="56">7</text>
<text x="930" y="392" direction="rtl" fill="#F5F2EC" font-weight="800" font-size="34">חיפוי חוץ</text>
<!-- pipes / צנרת 4 -->
<line x1="640" y1="520" x2="780" y2="520" stroke="#F5F2EC" stroke-width="2" opacity="0.5"/>
<circle cx="838" cy="520" r="44" fill="#C9A24B"/><text x="838" y="536" text-anchor="middle" fill="#16202E" font-weight="800" font-size="40">4</text>
<text x="900" y="528" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="30">צנרת</text>
<!-- floor / ריצוף 2 -->
<line x1="640" y1="650" x2="780" y2="650" stroke="#F5F2EC" stroke-width="2" opacity="0.5"/>
<circle cx="838" cy="650" r="40" fill="#C9A24B"/><text x="838" y="664" text-anchor="middle" fill="#16202E" font-weight="800" font-size="36">2</text>
<text x="894" y="658" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="28">ריצוף</text>
<!-- finish / גמר 1 -->
<line x1="640" y1="760" x2="780" y2="760" stroke="#F5F2EC" stroke-width="2" opacity="0.5"/>
<circle cx="838" cy="760" r="36" fill="#C9A24B"/><text x="838" y="773" text-anchor="middle" fill="#16202E" font-weight="800" font-size="32">1</text>
<text x="888" y="768" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="28">גמר</text>
</g>
<text x="1480" y="110" text-anchor="end" direction="rtl" fill="#C9A24B" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" letter-spacing="2" font-size="26">תקופות הבדק · שנים</text>
<text x="1480" y="855" text-anchor="end" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" letter-spacing="6" font-size="30">KURKOOS</text>
</svg>
