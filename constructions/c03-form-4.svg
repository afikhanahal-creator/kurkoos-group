<line x1="0" y1="20" x2="0" y2="34" stroke="#C9A24B" stroke-width="6"/>
</g>
<text x="800" y="612" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="30">חיבור תשתיות</text>
</g>
<!-- arrows converge to Form 4 -->
<g stroke="#9A9486" stroke-width="3" fill="none" opacity="0.7">
<path d="M1000 300 C 1140 360, 1180 380, 1230 430"/>
<path d="M1000 450 L 1230 450"/>
