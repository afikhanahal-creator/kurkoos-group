<circle cx="0" cy="0" r="48" fill="none" stroke="#C9A24B" stroke-width="5"/>
<path d="M0 -26 C 18 -6, 22 6, 8 22 C 24 16, 24 -2, 14 -14 C 16 0, 10 6, 4 10 C 12 -2, 0 -10, -4 -22 C -6 -8, -18 -2, -16 14 C -14 26, 0 30, 0 30 C -14 26, -18 8, 0 -26 Z" fill="#C9A24B"/>
</g>
<text x="800" y="312" direction="rtl" fill="#F5F2EC" font-weight="700" font-size="30">בטיחות אש</text>
<!-- accessibility -->
<g transform="translate(720,450)">
<circle cx="0" cy="0" r="48" fill="none" stroke="#C9A24B" stroke-width="5"/>
<circle cx="0" cy="-20" r="9" fill="#C9A24B"/>
<circle cx="-2" cy="12" r="20" fill="none" stroke="#C9A24B" stroke-width="6"/>
