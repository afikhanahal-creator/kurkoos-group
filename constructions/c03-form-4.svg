<rect x="500" y="426" width="22" height="22"/><rect x="522" y="448" width="22" height="22"/><rect x="500" y="470" width="22" height="22"/><rect x="522" y="492" width="22" height="22"/>
<rect x="500" y="514" width="22" height="22"/><rect x="522" y="536" width="22" height="22"/><rect x="500" y="558" width="22" height="22"/><rect x="522" y="580" width="22" height="22"/>
<rect x="500" y="602" width="22" height="22"/><rect x="522" y="624" width="22" height="22"/><rect x="500" y="646" width="22" height="22"/><rect x="522" y="668" width="22" height="22"/>
<rect x="500" y="690" width="22" height="22"/><rect x="522" y="712" width="22" height="22"/><rect x="500" y="734" width="22" height="22"/><rect x="522" y="756" width="22" height="22"/>
