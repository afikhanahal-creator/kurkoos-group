<g stroke="#9A9486" stroke-width="3" opacity="0.5"><line x1="-92" y1="-60" x2="92" y2="-60"/><line x1="-92" y1="-28" x2="92" y2="-28"/></g>
<circle cx="0" cy="60" r="58" fill="none" stroke="#C9A24B" stroke-width="6" stroke-dasharray="8 9"/>
