<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="בניין גמור בקו סיום, וטופס 4 שתלוי בשלושה אישורים אש נגישות ותשתיות">
<!-- KURKOOS PALETTE: ink #16202E | paper #F5F2EC | brass #C9A24B | stone #9A9486 | line #2C3A4D -->
