<text x="120" y="855" text-anchor="start" direction="rtl" fill="#C9A24B" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" letter-spacing="2" font-size="24">קו הסיום · אכלוס</text>
