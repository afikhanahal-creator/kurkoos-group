<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="נכס יחיד משווק לרשת קונים, המחשה של בלעדיות">
<!-- KURKOOS PALETTE: ink #16202E | paper #F5F2EC | brass #C9A24B | stone #9A9486 | line #2C3A4D -->
<rect width="1600" height="900" fill="#16202E"/>
<g stroke="#2C3A4D" stroke-width="1" opacity="0.16">
<line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="750" x2="1600" y2="750"/>
<line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/><line x1="1400" y1="0" x2="1400" y2="900"/>
</g>
<line x1="0" y1="800" x2="1600" y2="800" stroke="#C9A24B" stroke-width="3"/>
<!-- isolated lonely node (left, faded) -->
<g opacity="0.4">
<circle cx="270" cy="430" r="30" fill="none" stroke="#9A9486" stroke-width="4"/>
<text x="270" y="500" text-anchor="middle" direction="rtl" fill="#9A9486" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="600" font-size="22">בלי בלעדיות</text>
<text x="270" y="528" text-anchor="middle" direction="rtl" fill="#9A9486" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="600" font-size="18">איש לא אחראי</text>
</g>
<!-- central property node + network -->
<g>
<!-- spokes to buyer nodes -->
<g stroke="#C9A24B" stroke-width="2.5" opacity="0.8">
<line x1="930" y1="430" x2="1180" y2="230"/><line x1="930" y1="430" x2="1280" y2="330"/><line x1="930" y1="430" x2="1320" y2="450"/>
<line x1="930" y1="430" x2="1280" y2="560"/><line x1="930" y1="430" x2="1180" y2="650"/><line x1="930" y1="430" x2="1010" y2="690"/>
<line x1="930" y1="430" x2="820" y2="660"/>
</g>
<!-- buyer/agent nodes -->
<g fill="#F5F2EC">
<circle cx="1180" cy="230" r="22"/><circle cx="1280" cy="330" r="22"/><circle cx="1320" cy="450" r="22"/>
<circle cx="1280" cy="560" r="22"/><circle cx="1180" cy="650" r="22"/><circle cx="1010" cy="690" r="22"/><circle cx="820" cy="660" r="22"/>
</g>
<!-- central property (house) -->
<g transform="translate(930,430)">
<circle r="74" fill="#C9A24B"/>
<path d="M-34 6 L0 -30 L34 6 L34 38 L-34 38 Z" fill="#16202E"/>
<rect x="-10" y="14" width="20" height="24" fill="#C9A24B"/>
</g>
</g>
<text x="1480" y="110" text-anchor="end" direction="rtl" fill="#C9A24B" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" letter-spacing="2" font-size="26">בלעדיות = רשת סוכנים</text>
<text x="930" y="555" text-anchor="middle" direction="rtl" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="24">נכס אחד, מטה שלם</text>
<text x="1480" y="855" text-anchor="end" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" letter-spacing="6" font-size="30">KURKOOS</text>
</svg>
