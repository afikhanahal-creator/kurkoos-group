    <div class="kc-bar">
      ${['all','published','scheduled','draft'].map(s=>`<button class="kc-tab ${state.view==='articles'&&state.filterStatus===s?'on':''}" data-st="${s}">${s==='all'?'הכל':STATUS[s]}</button>`).join('')}
      <button class="kc-tab ${state.view==='notes'?'on':''}" data-view="notes" style="margin-inline-start:8px">הערות לסוכן</button>
      <div class="kc-sel">
        <span class="kc-count">${filtered().length} כתבות</span>
        <select class="kc-sel-i" id="kc-col">
          <option value="all" ${state.filterColumn==='all'?'selected':''}>כל הטורים</option>
          <option value="biba" ${state.filterColumn==='biba'?'selected':''}>ביצוע ובנייה</option>
          <option value="yazamut" ${state.filterColumn==='yazamut'?'selected':''}>יזמות נדל"ן</option>
          <option value="tivuch" ${state.filterColumn==='tivuch'?'selected':''}>המדריך לרוכש ולמוכר</option>
        </select>
      </div>
    </div>
    <div class="kc-wrap">
      ${state.view==='notes'? notesView() : `
      <div class="kc-edit">${sel?editor(sel):'<div class="kc-empty">בחר כתבה מהרשימה כדי לערוך, או צור כתבה חדשה.</div>'}</div>
      <div class="kc-list">${filtered().map(card).join('')||'<div class="kc-empty">אין כתבות בטאב הזה.</div>'}</div>`}
    </div>`;
    bind();
  }

  function card(a){
    return `<div class="kc-card ${a.id===state.selectedId?'on':''}" data-id="${a.id}">
      <img class="kc-thumb" src="${coverSrc(a)}" alt="">
      <div style="min-width:0">
        <h3>${escapeHtml(a.title)}</h3>
        <div class="kc-meta">
          <span class="kc-badge b-${a.status}">${STATUS[a.status]}</span>
          <span>${COLS[a.column]}</span><span>·</span><span>${a.date}</span>
        </div>
      </div>
    </div>`;
  }

  function cc(v,max){const n=(v||'').length;return `<div class="kc-charcount ${n>max?'over':''}">${n}/${max}</div>`;}

  function editor(a){
    return `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-size:13px;color:var(--stone)">${COLS[a.column]}</strong>
      <select id="f-status" style="width:auto">
        ${Object.keys(STATUS).map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${STATUS[s]}</option>`).join('')}
      </select>
    </div>
    <label>כותרת</label><input id="f-title" value="${escapeAttr(a.title)}">
    <div class="kc-row">
      <div><label>Slug (לכתובת)</label><input id="f-slug" value="${escapeAttr(a.slug)}"></div>
      <div><label>תאריך פרסום</label><input id="f-date" type="date" value="${a.date}"></div>
    </div>
    <label>קטגוריה</label><input id="f-cat" value="${escapeAttr(a.category)}">

    <label>תמונת כותרת</label>
    <div class="kc-cover">
      <img id="f-coverimg" src="${coverSrc(a)}" alt="">
      <div class="col">
        <button class="kc-btn sm" id="f-upload">העלה תמונה</button>
        <button class="kc-btn sm ghost" id="f-url" style="color:var(--ink);border:1px solid #d9d3c5">הדבק קישור</button>
        <button class="kc-btn sm danger" id="f-removeimg">הסר תמונה</button>
        <input type="file" id="f-file" accept="image/*" style="display:none">
      </div>
    </div>

    <label>תקציר (Excerpt)</label><textarea id="f-excerpt" rows="2">${escapeHtml(a.excerpt)}</textarea>
    <label>גוף הכתבה</label><textarea id="f-body" rows="10">${escapeHtml(a.body)}</textarea>

    <div class="kc-seo">
      <div class="ttl">SEO</div>
      <label>מילת מפתח ראשית</label><input id="f-kw" value="${escapeAttr(a.focusKeyword)}">
      <label>Meta Title</label><input id="f-mt" value="${escapeAttr(a.metaTitle)}">${cc(a.metaTitle,60)}
      <label>Meta Description</label><textarea id="f-md" rows="2">${escapeHtml(a.metaDescription)}</textarea>${cc(a.metaDescription,155)}
    </div>

    <div class="kc-actions">
      <button class="kc-btn save" id="f-save">שמור שינויים</button>
      <button class="kc-btn ghost" id="f-mdx" style="color:var(--ink);border:1px solid #d9d3c5">העתק כ-MDX</button>
      <button class="kc-btn ghost" id="f-dup" style="color:var(--ink);border:1px solid #d9d3c5">שכפל</button>
      <button class="kc-btn danger" id="f-del">מחק כתבה</button>
    </div>`;
  }

  function notesView(){
    return `<div class="kc-edit kc-notes" style="grid-column:1 / -1">
      <h2 style="margin:0 0 4px;font-size:18px">הערות בונות לסוכן</h2>
      <p style="margin:0 0 12px;color:#6b6457;font-size:14px">כתוב כאן כיול לכתיבה של הסוכן. ההערות נשמרות, ואפשר להזין אותן חזרה לפרומפט כדי לשפר את הסבב הבא. למשל: "הפתיחות נהיות צפויות", "הקוראים הגיבו הכי חזק לכתבות כשל".</p>
      <textarea id="n-text" rows="3" placeholder="כתוב הערה חדשה לסוכן..."></textarea>
      <div style="margin-top:8px"><button class="kc-btn" id="n-add">הוסף הערה</button></div>
      <div style="margin-top:16px">${state.notes.length?state.notes.map((n,i)=>`<div class="kc-note">${escapeHtml(n.text)}<div class="nd">${n.date} · <a href="#" data-del="${i}" style="color:#b4452f">מחק</a></div></div>`).join(''):'<div class="kc-empty">אין עדיין הערות.</div>'}</div>
    </div>`;
  }

  // ---- binding ----
  function bind(){
    root.querySelectorAll('.kc-tab[data-st]').forEach(b=>b.onclick=()=>{state.view='articles';state.filterStatus=b.dataset.st;render();});
    const vn=root.querySelector('.kc-tab[data-view]'); if(vn) vn.onclick=()=>{state.view='notes';render();};
    const col=root.querySelector('#kc-col'); if(col) col.onchange=()=>{state.filterColumn=col.value;render();};
    const nb=root.querySelector('#kc-new'); if(nb) nb.onclick=newArticle;
    root.querySelectorAll('.kc-card').forEach(c=>c.onclick=()=>{state.view='articles';state.selectedId=c.dataset.id;render();});

    const a=state.articles.find(x=>x.id===state.selectedId);
    if(a){
      const g=id=>root.querySelector(id);
      const live=(el,max)=>{if(!el)return;const cnt=el.parentElement.querySelector('.kc-charcount');if(cnt)el.oninput=()=>{const n=el.value.length;cnt.textContent=n+'/'+max;cnt.classList.toggle('over',n>max);};};
      live(g('#f-mt'),60); live(g('#f-md'),155);
      g('#f-save').onclick=()=>{
        a.title=g('#f-title').value;a.slug=g('#f-slug').value;a.date=g('#f-date').value;
        a.category=g('#f-cat').value;a.status=g('#f-status').value;a.excerpt=g('#f-excerpt').value;
        a.body=g('#f-body').value;a.focusKeyword=g('#f-kw').value;a.metaTitle=g('#f-mt').value;a.metaDescription=g('#f-md').value;
        save(KEY,state.articles).then(()=>{toast('נשמר ✓');render();});
      };
      g('#f-del').onclick=()=>{if(confirm('למחוק את הכתבה לצמיתות?')){state.articles=state.articles.filter(x=>x.id!==a.id);state.selectedId=null;save(KEY,state.articles).then(()=>{toast('נמחק');render();});}};
      g('#f-removeimg').onclick=()=>{a.coverType='seed';a.coverValue='';g('#f-coverimg').src=coverSrc(a);toast('התמונה הוסרה. נוצרה תמונת ברירת מחדל ממותגת.');};
      g('#f-url').onclick=()=>{const u=prompt('הדבק קישור לתמונה (URL):',a.coverType==='url'?a.coverValue:'');if(u){a.coverType='url';a.coverValue=u.trim();g('#f-coverimg').src=u.trim();}};
      g('#f-upload').onclick=()=>g('#f-file').click();
      g('#f-file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.8e6){alert('התמונה גדולה מדי (מעל ~1.8MB). בחר תמונה קלה יותר או השתמש בקישור.');return;}const r=new FileReader();r.onload=()=>{a.coverType='data';a.coverValue=r.result;g('#f-coverimg').src=r.result;toast('תמונה הוטענה. לא לשכוח לשמור.');};r.readAsDataURL(f);};
      g('#f-mdx').onclick=()=>{const mdx=toMDX(a);navigator.clipboard?.writeText(mdx).then(()=>toast('הועתק כ-MDX ✓'),()=>toast('העתקה נכשלה'));};
      g('#f-dup').onclick=()=>{const c=JSON.parse(JSON.stringify(a));c.id='n'+Date.now();c.title=a.title+' (עותק)';c.slug=a.slug+'-copy';c.status='draft';state.articles.unshift(c);state.selectedId=c.id;save(KEY,state.articles).then(()=>{toast('שוכפל כטיוטה');render();});};
    }

    if(state.view==='notes'){
      const add=root.querySelector('#n-add'); if(add) add.onclick=()=>{const t=root.querySelector('#n-text').value.trim();if(!t)return;state.notes.unshift({text:t,date:new Date().toISOString().slice(0,10)});save(NKEY,state.notes).then(()=>{toast('הערה נוספה ✓');render();});};
      root.querySelectorAll('a[data-del]').forEach(x=>x.onclick=ev=>{ev.preventDefault();state.notes.splice(+x.dataset.del,1);save(NKEY,state.notes).then(()=>render());});
    }
  }

  function newArticle(){
    const id='n'+Date.now();
    const a={id,column:['biba','yazamut','tivuch'].includes(state.filterColumn)?state.filterColumn:'tivuch',status:'draft',
      date:new Date().toISOString().slice(0,10),category:'',title:'כתבה חדשה',slug:'new-article',
      focusKeyword:'',metaTitle:'',metaDescription:'',excerpt:'',coverType:'seed',coverValue:'',body:''};
    state.articles.unshift(a);state.selectedId=id;state.view='articles';
    save(KEY,state.articles).then(()=>{toast('נוצרה טיוטה');render();});
  }

  function toMDX(a){
    const f=`---
title: "${a.title.replace(/"/g,'\\"')}"
slug: "${a.slug}"
date: "${a.date}"
category: "${a.category}"
focusKeyword: "${a.focusKeyword}"
metaTitle: "${a.metaTitle.replace(/"/g,'\\"')}"
metaDescription: "${a.metaDescription.replace(/"/g,'\\"')}"
coverImage: "${a.coverType==='seed'?('/images/blog/'+a.slug+'.svg'):a.coverValue.slice(0,80)}"
excerpt: "${a.excerpt.replace(/"/g,'\\"')}"
published: ${a.status==='published'}
---

${a.body}`;
    return f;
  }

  function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}

  // ---- init ----
  (async function init(){
    let arts=await load(KEY,null);
    if(!arts){ arts=seed(); await save(KEY,arts); }
    state.articles=arts;
    state.notes=await load(NKEY,[]);
    render();
  })();
})();
</script>
