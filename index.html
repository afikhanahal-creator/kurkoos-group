    <!-- ============================================================
         FONTS
         פונטי המותג (Almoni / Fb Metropolis) נטענים מ-/fonts/ דרך
         src/styles/fonts.css. עד שהקבצים יותקנו — fallback מ-Google.
         מדריך מלא: ראה FONTS.md בשורש הפרויקט.
         ============================================================ -->

    <!-- Preload לפונטי המותג הקריטיים (גוף + כותרות) להאצת טעינה.
         עד שהקבצים קיימים ב-public/fonts/ תופיע אזהרה בקונסול — זה תקין
         וייעלם אוטומטית ברגע שהקבצים שם. -->
    <link rel="preload" href="/fonts/almoni-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/almoni-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Fallback זמני: Rubik (כותרות) + Assistant (גוף) — תמיכה מלאה עברית + לטינית -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- חיבור מוקדם ל-CDN של התמונות → טעינת תמונות הפרויקטים מהירה יותר -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <!-- פונטי הגיבוי (Google) נטענים אסינכרונית כדי שלא יחסמו את הציור הראשון
         של העמוד. פונטי המותג (Almoni) כבר נטענים מראש מקומית (preload למעלה),
         לכן הטקסט מוצג מיד. הטריק media=print→all הופך את הבקשה ללא-חוסמת. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Heebo:wght@300..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Heebo:wght@300..900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>קורקוס גרופ | Kurkoos Group</title>

    <!-- ============================================================
         מסך-פתיחה מיידי (Splash) — נצבע ישירות מה-HTML, עוד לפני שה-JS
         של האפליקציה ירד ויתפרס. כך במובייל רואים מיד את הלוגו במקום
         מסך לבן ריק בזמן טעינת הבאנדל. React מחליף את תוכן #root ברגע
         שהוא עולה → ה-Splash נעלם אוטומטית.
         ============================================================ -->
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; background: #f7f8fa;
      }
      #app-splash img { width: 168px; height: auto; animation: splashPulse 1.4s ease-in-out infinite; }
      #app-splash .app-splash__bar {
        width: 124px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgba(16, 85, 114, 0.14); position: relative;
      }
      #app-splash .app-splash__bar::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, #105572, transparent);
        animation: splashSlide 1.1s linear infinite;
      }
      @keyframes splashPulse { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
      @keyframes splashSlide { 0% { transform: translateX(-100%) } 100% { transform: translateX(100%) } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img, #app-splash .app-splash__bar::after { animation: none }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <img src="/kurkoos-logo.svg" alt="קורקוס גרופ" width="168" />
        <div class="app-splash__bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
