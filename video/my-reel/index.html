<!doctype html>
<html lang="he" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="effects/fx.css" />
    <style>
      @font-face { font-family: 'Heebo'; src: url('assets/fonts/Heebo.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }
      :root { --accent: #FF7A3D; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: 'Heebo', sans-serif; }
      #frame { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #frame > video, .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
      #frame > video { object-fit: cover; }
      #src { z-index: 1;  }
      #behind { z-index: 2; }
      #cutout { z-index: 3; background: transparent; }
      #front { z-index: 4; }
      #titles { z-index: 5; }
      .layer { pointer-events: none; }
      
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.7" data-width="1080" data-height="1920" data-fps="30">
      <div id="frame">
        <video id="src" class="clip" src="assets/video.mp4" data-start="0" data-duration="14.7" data-media-start="0" data-has-audio="true" data-track-index="0" playsinline preload="auto"></video>
        <div id="behind" class="layer"></div>
        <video id="cutout" class="clip" src="assets/cutout.webm" data-start="0" data-duration="14.7" data-media-start="0" data-track-index="1" muted playsinline preload="auto"></video>
      </div>
      <div id="front" class="layer"></div>
      <div id="titles" class="layer"></div>
    </div>
    <script src="effects/fx.js"></script>
    <script>
      window.__REEL_STYLE = { accent: "#FF7A3D" };
      const PLAN = {"duration":14.7,"titles":true,"effects":[{"n":1,"id":"title","name":"כותרת אות-אות","layer":"titles","t":0.3,"dur":0.95,"params":{"text":"כותרת אות-אות"}},{"n":2,"id":"pill","name":"הדגשת מילה","layer":"front","t":1.3,"dur":0.9499999999999997,"params":{"text":"הדגשה"}},{"n":3,"id":"behind","name":"טקסט מאחורי הדובר","layer":"behind","t":2.3,"dur":0.95,"params":{"text":"מאחור"}},{"n":4,"id":"counter","name":"מספר קופץ","layer":"front","t":3.3,"dur":0.95,"params":{"value":14,"suffix":"","label":"אפקטים"}},{"n":5,"id":"underline","name":"קו מצויר","layer":"front","t":4.3,"dur":0.95,"params":{"text":"קו שמצויר ביד"}},{"n":6,"id":"card","name":"כרטיס מידע","layer":"front","t":5.3,"dur":0.95,"params":{"title":"כרטיס מידע","text":"כותרת ושורת פירוט"}},{"n":7,"id":"punch","name":"פאנץ' אין","layer":"frame","t":6.3,"dur":1,"params":{"zoom":1.08}},{"n":8,"id":"checklist","name":"צ'קליסט","layer":"front","t":7.3,"dur":0.9500000000000008,"params":{"items":["שורה ראשונה","שורה שנייה","שורה שלישית"]}},{"n":9,"id":"quote","name":"בועת ציטוט","layer":"front","t":8.3,"dur":0.95,"params":{"text":"בועת ציטוט ליד הכתף"}},{"n":10,"id":"pin","name":"תגית מיקום","layer":"front","t":9.3,"dur":0.95,"params":{"text":"הוד השרון"}},{"n":11,"id":"icon","name":"אייקון קופץ","layer":"front","t":10.3,"dur":0.95,"params":{"icon":"home","text":"בית"}},{"n":12,"id":"split","name":"השוואה","layer":"front","t":11.3,"dur":0.95,"params":{"a":"לפני","b":"אחרי"}},{"n":13,"id":"bar","name":"פס מודגש","layer":"behind","t":12.3,"dur":0.8499999999999985,"params":{"text":"פס"}},{"n":14,"id":"cta","name":"כפתור","layer":"front","t":13.2,"dur":1.5,"params":{"text":"לפרטים בפרופיל"}}]};
      const tl = gsap.timeline({ paused: true });
      const ctx = { frame: document.getElementById('frame'), n: 0 };
      tl.set({}, {}, PLAN.duration); // the timeline spans the whole film
      for (const f of PLAN.effects) {
        ctx.n = f.n;
        if (PLAN.titles && f.id !== 'title') FX14.title(tl, Math.max(0, f.t - 0.15), { n: f.n, text: f.name, dur: f.dur + 0.15 }, ctx);
        FX14[f.id](tl, f.t, Object.assign({ dur: f.dur, n: f.n }, f.params), ctx);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
