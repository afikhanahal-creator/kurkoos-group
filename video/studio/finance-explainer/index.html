<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Kurkoos Finance: the product film</title>
<!-- The product film shown in the finance system after sign-in and sign-out. 1920x1080, about a minute.
     Story: the promise, the problem, the answer, five things the system does for you, the name.
     Every position is a pure function of time (seek) and every time comes from the narration (timeline.js).
     The screens are screenshots of the local test system with demo data (docs/finance/EXPLAINER-VIDEO.md).
     Rules of this film: one calm camera move per screen, cross-fades between screens, no sound effects at all. -->
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:"Almoni";font-weight:300;src:url(../../fonts/Almoni-300.ttf)}
  @font-face{font-family:"Almoni";font-weight:400;src:url(../../fonts/Almoni-400.ttf)}
  @font-face{font-family:"Almoni";font-weight:700;src:url(../../fonts/Almoni-700.ttf)}
  html,body{margin:0;background:#07293a}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Almoni";color:#f7f8fa;
    background:radial-gradient(1500px 950px at 24% 28%, #135672 0%, #0a3549 46%, #07293a 100%)}
  .abs{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity}
  .rtl{direction:rtl;text-align:right;unicode-bidi:plaintext}
  .mid{direction:rtl;text-align:center;unicode-bidi:plaintext}
  /* type: one family, three sizes */
  .hero{font-weight:700;font-size:118px;line-height:1.06;white-space:nowrap}
  .title{font-weight:700;font-size:82px;line-height:1.08;width:580px}
  .wide{width:1400px}
  .value{font-weight:300;font-size:40px;line-height:1.32;width:580px;color:#d3e2ea}
  .lead{font-weight:300;font-size:46px;line-height:1.25;white-space:nowrap;color:#d3e2ea}
  /* the screen */
  #card{width:1140px;height:738px;border-radius:22px;overflow:hidden;background:#f3f5f7;box-shadow:0 40px 90px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.10)}
  #card .bar{position:absolute;left:0;top:0;width:100%;height:44px;background:#e6eaee;border-bottom:1px solid #d4dae0}
  #card .bar i{position:absolute;top:15px;width:14px;height:14px;border-radius:50%;background:#c4ccd4}
  #card .bar span{position:absolute;right:22px;top:11px;font-weight:400;font-size:19px;color:#4d6170;direction:rtl}
  #view{position:absolute;left:0;top:44px;width:1140px;height:694px;overflow:hidden;background:#fff}
  #view .shot{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
  #view .shot img{display:block;width:1440px;height:900px}
  .glow{position:absolute;border:4px solid #a90b0c;border-radius:16px;box-sizing:border-box;box-shadow:0 0 0 3000px rgba(7,41,58,.34),0 0 0 10px rgba(169,11,12,.14)}
  .dots{display:flex;flex-direction:row-reverse;gap:10px}
  .dots i{width:44px;height:6px;border-radius:3px;background:rgba(143,182,200,.30)}
  .dots i.on{background:#f7f8fa}
  /* the problem: papers everywhere */
  .paper{width:230px;height:150px;border-radius:16px;background:#f7f8fa;color:#07293a;box-shadow:0 22px 50px rgba(0,0,0,.32);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:30px}
  .paper svg{width:46px;height:46px}
  .pain{font-weight:700;font-size:44px;white-space:nowrap;padding:16px 34px;border-radius:999px;border:2px solid rgba(143,182,200,.6);color:#f7f8fa}
  #phone{width:290px;height:600px;border-radius:44px;background:#0b1820;padding:12px;box-sizing:border-box;box-shadow:0 40px 80px rgba(0,0,0,.5)}
  #phone div{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff}
  #phone img{display:block;width:100%}
  #prog{left:0;top:1074px;height:6px;width:1920px;background:rgba(255,255,255,.08)}
  #prog i{display:block;height:100%;width:100%;background:#8fb6c8;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage">
  <div id="intro" class="abs"></div>
  <div id="problem" class="abs"></div>
  <div id="card" class="abs"><div class="bar"><i style="left:22px"></i><i style="left:46px"></i><i style="left:70px"></i><span>המספרים במסכים להדגמה בלבד</span></div><div id="view"></div></div>
  <div id="phone" class="abs"><div><img src="shots/phone.jpg" alt=""></div></div>
  <div id="text" class="abs"></div>
  <div id="outro" class="abs"></div>
  <div id="prog" class="abs"><i></i></div>
</div>
<script src="../lib/studio.js"></script>
<script src="timeline.js"></script>
<script>
const { clamp, lerp, smooth } = Studio
const W = 1920, H = 1080
// ?c={"durations":{…}} from the renderer (out/finance-explainer-config.json, written by mix.cjs) sets the clock to the voice
const CFG = Studio.config({ durations: null })
const $ = (id) => document.getElementById(id)
const el = (parent, cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; parent.appendChild(d); return d }
const put = (node, x, y, o = 1, s = 1, r = 0) => { node.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(3)}deg)`; node.style.opacity = clamp(o).toFixed(3) }
const ease = (k) => { k = clamp(k); return k * k * k * (k * (k * 6 - 15) + 10) }        // a slow start and a slow stop
const fade = (t, t0, t1, i = 0.6, o = 0.5) => smooth((t - t0) / i) * (1 - smooth((t - (t1 - o)) / o))
const lift = (t, t0, d = 0.9, px = 28) => px * (1 - ease((t - t0) / d))

// what the narrator says (the on-screen text is shorter: a title and one line of value)
const SAY = {
  v01: 'כל ההוצאות של הקבוצה. במקום אחד. בכל רגע.',
  v02: 'היום, חשבוניות מגיעות מכל כיוון. במייל, בוואטסאפ, בנייר. ושעות הולכות על חיפושים, הקלדות ומעקב.',
  v03: 'קורקוס פיננס מרכזת הכול במערכת אחת, שעובדת בשבילכם.',
  v04: 'המסמכים נאספים לבד. המערכת קוראת כל חשבונית, וממלאת את הפרטים במקומכם.',
  v05: 'אתם רק מאשרים. מה שדורש תשומת לב מסומן, וכל השאר כבר מסודר.',
  v06: 'ובכל רגע, תמונת מצב מלאה. כמה הוצאנו החודש, באיזו חברה, ומה השתנה.',
  v07: 'בסוף החודש, הדוח לרואה החשבון כבר מוכן. לחיצה אחת, והוא בדרך.',
  v08: 'וכל מסמך נשמר במקומו, וזמין מכל מקום. גם מהטלפון.',
  v09: 'קורקוס פיננס. פחות ניירת, יותר שליטה.',
}
const T = timeline(SAY, CFG.durations), DUR = T.duration

/* ---------- five things the system does for you ----------
   One screen each, already framed on its clean part (no menus, no clutter), and one calm camera move.
   cam: [[part of the sentence 0..1, zoom, centre x, centre y], …] in the screenshot's own pixels (1440 x 900).
   glow: [[from, to, x, y, w, h], …] the place the sentence is about, lit while it is said (parts of the sentence). */
const FEATURES = [
  { shot: 'today', title: 'הכול נאסף לבד', value: 'כל חשבונית נקראת ונרשמת,<br>בלי להקליד דבר',
    cam: [[0, 1.3, 640, 740], [1, 1.5, 780, 740]], glow: [[0.42, 1.05, 476, 596, 688, 300]] },
  { shot: 'documents', title: 'אתם רק מאשרים', value: 'מה שדורש תשומת לב מסומן.<br>כל השאר כבר מסודר',
    cam: [[0, 1.3, 760, 430], [1, 1.5, 800, 440]], glow: [[0.3, 1.05, 690, 250, 92, 330]] },
  { shot: 'home2', title: 'תמונת מצב<br>בכל רגע', value: 'כמה הוצאנו, באיזו חברה,<br>ומה השתנה',
    cam: [[0, 1.42, 800, 340], [0.62, 1.42, 800, 340], [1, 1.42, 760, 700]], glow: [[0.26, 0.5, 762, 274, 400, 236], [0.5, 0.72, 174, 176, 990, 76], [0.8, 1.08, 376, 540, 786, 360]] },
  { shot: 'report', title: 'הדוח מוכן.<br>בלחיצה אחת', value: 'לרואה החשבון,<br>בסוף כל חודש',
    cam: [[0, 1.3, 760, 600], [1, 1.5, 820, 720]], glow: [[0.55, 1.05, 696, 822, 438, 60]] },
  { shot: 'drive', title: 'כל מסמך במקומו', value: 'ארכיון מסודר,<br>זמין גם מהטלפון',
    cam: [[0, 1.3, 560, 560], [1, 1.42, 520, 590]], glow: [[0.12, 0.6, 46, 458, 862, 246]] },
]
FEATURES.forEach((f, k) => Object.assign(f, T.features[k], { v: T.v[T.features[k].id] }))
const at = (f, part) => f.v.at + part * (f.v.end - f.v.at)      // a part of the sentence, as a time
const CARD = { x: 84, y: 196, w: 1140, h: 694 }                   // where the screen rests while the features play
const TEXT = { right: 1836 }

const ICON = {
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="#105572" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#1f8f4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-5a8 8 0 1 1 16-3z"/></svg>',
  paper: '<svg viewBox="0 0 24 24" fill="none" stroke="#a90b0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a6d1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>',
}
const N = {}

async function build() {
  // the promise
  N.logo = el($('intro'), 'abs', '<img src="../../assets/logo-white.png" style="display:block;width:150px" alt="">')
  N.promise = ['כל ההוצאות של הקבוצה', 'במקום אחד', 'בכל רגע'].map((x) => el($('intro'), 'abs hero rtl', x))
  // the problem
  N.probTitle = el($('problem'), 'abs title wide mid', 'חשבוניות מגיעות מכל כיוון')
  N.papers = [['mail', 'במייל'], ['chat', 'בוואטסאפ'], ['paper', 'בנייר'], ['sheet', 'בטבלאות'], ['paper', 'במגירה'], ['mail', 'בעוד מייל']].map(([i, x]) => el($('problem'), 'abs paper', ICON[i] + `<span class="rtl">${x}</span>`))
  N.pains = ['חיפושים', 'הקלדות', 'מעקב'].map((x) => el($('problem'), 'abs pain rtl', x))
  // the answer
  N.ansTitle = el($('text'), 'abs title wide mid', 'מערכת אחת')
  N.ansLead = el($('text'), 'abs lead mid', 'שעובדת בשבילכם')
  // the screens: the overview appears twice (behind the answer, and as the third feature), so it has two layers
  N.shots = {}
  for (const [name, file] of [['home', 'home'], ['today', 'today'], ['documents', 'documents'], ['home2', 'home'], ['report', 'report'], ['drive', 'drive']]) N.shots[name] = el($('view'), 'shot', `<img src="shots/${file}.jpg" alt="">`)
  for (const f of FEATURES) {
    f.node = N.shots[f.shot]
    f.glows = f.glow.map((g) => { const d = el(f.node, 'glow'); Object.assign(d.style, { left: g[2] + 'px', top: g[3] + 'px', width: g[4] + 'px', height: g[5] + 'px' }); return d })
    f.titleNode = el($('text'), 'abs title rtl', f.title)
    f.valueNode = el($('text'), 'abs value rtl', f.value)
  }
  N.dots = el($('text'), 'abs dots', FEATURES.map(() => '<i></i>').join(''))
  // the name
  N.endLogo = el($('outro'), 'abs', '<img src="../../assets/logo-white.png" style="display:block;width:200px" alt="">')
  N.endName = el($('outro'), 'abs hero', 'Kurkoos Finance')
  N.endLine = el($('outro'), 'abs lead mid', 'פחות ניירת, יותר שליטה')
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})))
  // measure once: text is placed by its own size
  for (const d of document.querySelectorAll('#stage .abs')) { d.style.transform = 'none'; d._w = d.offsetWidth; d._h = d.offsetHeight }
}
const centre = (n, y, o, dy = 0) => put(n, (W - n._w) / 2, y + dy, o)
const right = (n, y, o, dy = 0) => put(n, TEXT.right - n._w, y + dy, o)

// the camera inside the screen: zoom and centre, kept inside the screenshot
function frame(node, z, cx, cy) {
  const sc = (CARD.w / 1440) * z
  const x = clamp(CARD.w / 2 - cx * sc, CARD.w - 1440 * sc, 0), y = clamp(CARD.h / 2 - cy * sc, CARD.h - 900 * sc, 0)
  node.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${sc.toFixed(4)})`
}
// a path through keys [[time, …values]] with a slow start and stop on every leg
function along(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1)
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const k = ease((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])); return keys[i].slice(1).map((v, n) => lerp(keys[i - 1][n + 1], v, k)) }
  return keys[keys.length - 1].slice(1)
}

function seek(t) {
  const I = T.intro, P = T.problem, A = T.answer, O = T.outro, F0 = FEATURES[0], FL = FEATURES[FEATURES.length - 1]
  // ---- the promise: three short lines, each arriving with its words ----
  { const v = T.v.v01, span = (v.end - v.at) / 3, top = 330
    put(N.logo, (W - N.logo._w) / 2, 96, fade(t, 0.1, I.t1))
    N.promise.forEach((d, i) => { const a = v.at - 0.15 + i * span; centre(d, top + i * 138, fade(t, a, I.t1, 0.5), lift(t, a)); d.style.color = i === 0 ? '#f7f8fa' : '#8fb6c8' }) }
  // ---- the problem: papers everywhere, and three things that eat the day ----
  { const v = T.v.v02
    centre(N.probTitle, 120, fade(t, P.t0 + 0.1, P.t1, 0.6, 0.6), lift(t, P.t0 + 0.1))
    const home = [[1320, 390, -7], [820, 360, 5], [330, 410, -4], [1120, 620, 6], [560, 650, -6], [1500, 680, 4]]
    N.papers.forEach((d, i) => {
      const a = P.t0 + 0.5 + i * 0.32, drift = t - P.t0
      // towards the answer they come together and fade: one place for all of them
      const pull = ease((t - (P.t1 - 0.9)) / 1.3)
      const x = lerp(home[i][0] - 115 + 16 * Math.sin(drift * 0.5 + i * 1.7), W / 2 - 115, pull)
      const y = lerp(home[i][1] - 75 + 12 * Math.cos(drift * 0.45 + i * 1.3), 470, pull)
      put(d, x, y + lift(t, a, 0.9, 40), smooth((t - a) / 0.6) * (1 - smooth((t - (P.t1 - 0.4)) / 0.9)), lerp(1, 0.7, pull), lerp(home[i][2] + 1.5 * Math.sin(drift * 0.4 + i), 0, pull))
    })
    const p0 = v.at + (v.end - v.at) * 0.62, gap = (v.end - p0) / 3, total = N.pains.reduce((s, d) => s + d._w, 0) + 2 * 28
    let x = (W + total) / 2
    N.pains.forEach((d, i) => { x -= d._w; const a = p0 + i * gap - 0.1; put(d, x, 880 + lift(t, a, 0.7, 20), fade(t, a, P.t1, 0.4, 0.5)); x -= 28 }) }
  // ---- the screen: born in the middle as the answer, then moves aside and stays for all five ----
  { const k = ease((t - (F0.t0 - 0.1)) / 1.0), out = ease((t - (O.t0 - 0.1)) / 1.0)
    const s = lerp(0.74, 1, k) * lerp(1, 0.94, out)
    const x = lerp((W - CARD.w * 0.74) / 2, CARD.x, k), y = lerp(330, CARD.y - 44, k)
    const o = smooth((t - (A.t0 + 0.25)) / 0.9) * (1 - smooth((t - (O.t0 - 0.1)) / 0.8))
    put($('card'), x, y + 46 * (1 - ease((t - (A.t0 + 0.25)) / 1.1)), o, s)
    centre(N.ansTitle, 96, fade(t, A.t0 + 0.2, F0.t0 + 0.2, 0.7, 0.5), lift(t, A.t0 + 0.2))
    centre(N.ansLead, 196, fade(t, A.t0 + 0.7, F0.t0 + 0.2, 0.7, 0.5), lift(t, A.t0 + 0.7)) }
  // ---- inside the screen: the overview behind the answer, then one screen per feature, each fading in over the last ----
  { N.shots.home.style.opacity = 1; N.shots.home.style.zIndex = 1; frame(N.shots.home, 1, 720, 450)
    FEATURES.forEach((f, k) => {
      f.node.style.zIndex = 2 + k
      f.node.style.opacity = smooth((t - (f.t0 + 0.1)) / 0.8).toFixed(3)
      const [z, cx, cy] = along(t, f.cam.map(([part, ...c]) => [part === 0 ? f.t0 : at(f, part), ...c]))
      frame(f.node, z, cx, cy)
      f.glows.forEach((g, i) => { const [a, b] = f.glow[i]; g.style.opacity = (smooth((t - at(f, a)) / 0.5) * (1 - smooth((t - (at(f, b) - 0.5)) / 0.5))).toFixed(3) })
    }) }
  // ---- the words next to the screen ----
  FEATURES.forEach((f, k) => {
    const a = f.t0 + 0.35, b = k === FEATURES.length - 1 ? O.t0 + 0.1 : f.t1 + 0.25
    f.top = (H - (f.titleNode._h + 26 + f.valueNode._h)) / 2 - 6
    right(f.titleNode, f.top, fade(t, a, b, 0.6, 0.45), lift(t, a))
    right(f.valueNode, f.top + f.titleNode._h + 26, fade(t, a + 0.35, b, 0.6, 0.45), lift(t, a + 0.35))
  })
  { const cur = FEATURES.findIndex((f) => t >= f.t0 + 0.2 && t < f.t1 + 0.2)
    right(N.dots, 330, fade(t, F0.t0 + 0.4, O.t0 + 0.1, 0.6, 0.4))
    ;[...N.dots.children].forEach((d, i) => { d.className = i === cur ? 'on' : '' }) }
  // the phone, when the sentence reaches it
  { const a = at(FL, 0.45), p = ease((t - a) / 1.0); put($('phone'), 900, 290 + 90 * (1 - p), smooth((t - a) / 0.6) * (1 - smooth((t - (O.t0 - 0.1)) / 0.7))) }
  // ---- the name ----
  { const a = O.t0 + 0.7, top = 250
    centre(N.endLogo, top, fade(t, a, DUR + 2, 0.8), lift(t, a))
    centre(N.endName, top + N.endLogo._h + 50, fade(t, a + 0.4, DUR + 2, 0.8), lift(t, a + 0.4))
    centre(N.endLine, top + N.endLogo._h + 50 + N.endName._h + 26, fade(t, a + 1.0, DUR + 2, 0.8), lift(t, a + 1.0)) }
  $('prog').firstChild.style.transform = `scaleX(${clamp(t / DUR).toFixed(4)})`
}

// every text stays inside the frame, and the words next to the screen never touch it
function check(t) {
  const bad = []
  for (const d of document.querySelectorAll('#text .abs, #intro .abs, #outro .abs, #problem .abs')) {
    if (+d.style.opacity < 0.05) continue
    const r = d.getBoundingClientRect(), name = d.textContent.trim().slice(0, 24)
    if (r.left < 40 || r.right > W - 40 || r.top < 30 || r.bottom > H - 24) bad.push(`out of frame: ${name}`)
    const side = FEATURES.some((f) => f.titleNode === d || f.valueNode === d)
    if (side && r.left < CARD.x + CARD.w + 30) bad.push(`text over the screen: ${name} (${Math.round(r.left)})`)
  }
  return bad
}

Studio.define({ w: W, h: H, duration: DUR,
  stages: [{ t: T.intro.t1 - 0.9, label: 'promise' }, { t: (T.problem.t0 + T.problem.t1) / 2, label: 'problem' }, { t: T.problem.t1 - 1.1, label: 'pains' }, { t: T.answer.t1 - 0.9, label: 'answer' },
    ...FEATURES.flatMap((f, k) => [{ t: f.t0 + 0.5, label: `into ${k + 1}` }, { t: at(f, 0.5), label: `feature ${k + 1}` }, { t: at(f, 0.95), label: `feature ${k + 1} end` }]), { t: DUR - 1, label: 'name' }],
  fonts: ['700 82px "Almoni"', '400 30px "Almoni"', '300 40px "Almoni"'], build, seek, check })
</script>
</body>
</html>
