<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<!-- Cover for reel B ("מי עומד מאחורי הפיקוח"). 1080x1920; everything that matters sits inside the 4:5 grid crop (y 285 to 1635). -->
<style>
  @font-face{font-family:Almoni;font-weight:400;src:url(../../fonts/Almoni-400.ttf)}
  @font-face{font-family:Almoni;font-weight:700;src:url(../../fonts/Almoni-700.ttf)}
  html,body{margin:0;background:#f7f8fa}
  #c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Almoni;color:#07293a;
     background:#f7f8fa;
     background-image:linear-gradient(#8fb6c833 2px,transparent 2px),linear-gradient(90deg,#8fb6c833 2px,transparent 2px);
     background-size:60px 60px;background-position:30px 30px}
  .frame{position:absolute;inset:60px;border:4px solid #8fb6c8;border-radius:6px}
  .logo{position:absolute;top:310px;left:100px;width:224px;height:210px}
  .kick{position:absolute;top:330px;right:110px;font-weight:700;font-size:54px;background:#07293a;color:#f7f8fa;border-radius:999px;padding:14px 34px 20px}
  h1{position:absolute;top:440px;right:104px;margin:0;font-weight:700;font-size:138px;line-height:.95;letter-spacing:-2px}
  h1 span{display:block}
  h1 .r{color:#a90b0c}
  .draw{position:absolute;top:880px;left:110px;width:520px;height:330px}
  .stamp{position:absolute;top:960px;right:110px;transform:rotate(-6deg);border:12px solid #a90b0c;color:#a90b0c;border-radius:30px;font-weight:700;font-size:118px;line-height:1;padding:18px 40px 34px}
  .sub{position:absolute;top:1300px;right:110px;font-weight:700;font-size:64px;line-height:1.1}
  .sub small{display:block;font-weight:400;font-size:44px;color:#105572;margin-top:14px}
  .tel{position:absolute;top:1300px;left:110px;font-weight:700;font-size:52px;color:#a90b0c;direction:ltr}
  .ph{position:absolute;left:300px;top:790px;width:480px;height:720px;border-radius:24px;overflow:hidden;box-shadow:0 18px 40px #07293a44}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph .band{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(#07293a00,#07293aee)}
  .ph b{position:absolute;left:0;right:0;bottom:92px;text-align:center;color:#f7f8fa;font-size:66px}
  .ph i{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-style:normal}
  .ph i span{background:#a90b0c;color:#f7f8fa;font-weight:700;font-size:38px;padding:8px 26px 12px;border-radius:999px}
  .badge{position:absolute;left:110px;top:1330px;width:170px;height:175px}
  .logo{width:150px;height:141px;top:300px;left:110px}
  h1{top:500px}
  .ph{top:840px}
  .badge{top:1390px}
</style></head><body>
<div id="c">
  <div class="frame"></div>
  <img class="logo" src="kurkoos-logo.svg" alt="">
  <div class="kick">קבוצת קורקוס</div>
  <h1><span>מי עומד מאחורי</span><span class="r">הפיקוח?</span></h1>
  <div class="ph"><img src="shlomi-standing.jpg" alt=""><div class="band"></div><b>שלומי קורקוס</b><i><span>מנכ"ל ומייסד</span></i></div>
  <img class="badge" src="shchinta.png" alt="">
</div>
</body></html>
