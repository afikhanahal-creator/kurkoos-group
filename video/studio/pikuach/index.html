<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Kurkoos supervision</title>
<!-- Kurkoos reel: "פיקוח". A drawing sheet (paper, faint mist grid, navy line work, red only for what matters).
  9:16, timed by the voice (voice/timings.js, written by tts.py): one scene per line of narration. Pure function of t.
  THE TWO SIDES (used the same way in every scene, and named by the legend at the top right):
    בנייה (construction, the contractor): navy. Things are built up piece by piece: lines draw themselves, floors stack,
      blocks drop in, concrete pours and rises.
    פיקוח (supervision, our inspector): red. A scan line or magnifier passes, finds the fault, a red ring draws around it,
      a check mark draws itself, a stamp lands ("עצור", "נבדק לפני תשלום"), Shechinta's badge.
  CUTS: the ruler wipes down the sheet (new scene above it, old one below, each clipped to its side), and at three match
    cuts the camera zooms through a point of the old scene into the new one (foundation into the defect cards, the empty
    inspector column into Shechinta's badge, the four division boxes into the four division cards).
  SCENES (line: picture)
  0  the cover frame (cover.png, a render of cover.html) for 0.5 s, then the ruler wipes into the hook
  1  בנייה: the house draws itself floor by floor, red faults in the foundation, the concrete rises and hides them
  2  פיקוח: three detail cards; each drawing draws itself, then a red ring draws around its fault
  3  the cost: a short navy stack while it is visible, a tall red stack block by block after the concrete
  4  split: "הקבלן בונה" (floors stack) against an empty dashed inspector column with a red "?"
  5  פיקוח: Shechinta's badge stamps in, its ring draws, a magnifier circles it, "העיניים שלכם באתר"
  6  both: rebar is laid in the form, the pour starts, the red scan line finds the bar out of place, "עצור" lands,
     the bar is set right, a check draws, the pour goes on
  7  פיקוח: the contractor's bill writes itself line by line, the magnifier checks each line, "נבדק לפני תשלום", schedule and budget
  8  both: another contractor's building rises floor by floor, the handover protocol ticks one item per floor
  9  Shlomi Kurkoos, the standing portrait tall, its frame draws itself, name and role over the bottom of the photo
  10 4 divisions: the boxes rise into place (ביצוע navy, פיקוח red), the roof draws over them
  11 the four arms by name with their logos; a bracket links ראיתה (builds) and שכינתא (supervises)
  12 the route from קרקע to מפתח: at each station a navy block rises and a red check verifies it
  13 the contract, the pen moves to the signature line and stops: "דברו איתנו"
  14 end card on navy: logo, דברו איתנו, קבוצת קורקוס, phone, site
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../lib/fonts.css">
<style>
  @font-face{font-family:Almoni;font-weight:400;font-display:block;src:url(../../fonts/Almoni-400.ttf)}
  @font-face{font-family:Almoni;font-weight:700;font-display:block;src:url(../../fonts/Almoni-700.ttf)}
  body{background:#f7f8fa;margin:0}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f7f8fa;direction:rtl;font-family:Almoni}
  #sheet{position:absolute;inset:0}
  #grain{position:absolute;inset:0;opacity:.05;pointer-events:none;z-index:50}
  .abs{position:absolute;left:0;top:0}
  .sc{position:absolute;inset:0;display:none}
  .cam{position:absolute;inset:0}
  .big{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#07293a;line-height:.95}
  .lbl{position:absolute;font-weight:700;color:#07293a;white-space:nowrap;line-height:1}
  .chip{position:absolute;font-weight:700;font-size:48px;line-height:1;padding:16px 30px 20px;border-radius:999px;white-space:nowrap;background:#07293a;color:#f7f8fa}
  .chip.r{background:#a90b0c}
  .chip.l{background:#f7f8fa;color:#07293a;border:4px solid #07293a}
  .chip.d{background:#f7f8fa;color:#a90b0c;border:4px dashed #a90b0c}
  .hdr{position:absolute;right:90px;top:220px;display:flex;align-items:center;gap:26px}
  .mk{position:relative;width:118px;height:118px;border:6px solid #07293a;border-radius:50%;background:#f7f8fa;flex:none}
  .mk:after{content:"";position:absolute;left:0;right:0;top:56px;height:6px;background:#07293a}
  .mk b{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:44px;line-height:1;color:#a90b0c}
  .mk i{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:28px;line-height:1;color:#105572;font-style:normal;font-weight:700}
  .hdr .tt span{display:block;font-weight:700;font-size:84px;color:#07293a;line-height:1}
  .hdr .tt small{display:block;font-size:40px;color:#105572;font-weight:700;margin-bottom:8px;line-height:1}
  #world{display:block}
  #cta{position:absolute;left:66px;top:52px;z-index:31;display:none;background:#a90b0c;color:#f7f8fa;font-weight:700;font-size:36px;line-height:1;padding:12px 26px 16px;border-radius:999px;white-space:nowrap}
  #cta b{direction:ltr;unicode-bidi:isolate;margin-right:12px}
  /* the legend of the two sides: the side a scene shows is filled, the other is an outline */
  #legend{position:absolute;right:70px;top:52px;z-index:31;display:flex;gap:12px}
  #legend span{font-weight:700;font-size:34px;line-height:1;padding:11px 24px 15px;border-radius:999px;border:4px solid #8fb6c8;color:#8fb6c8;background:#f7f8fa;white-space:nowrap}
  #legend .b.on{background:#07293a;border-color:#07293a;color:#f7f8fa}
  #legend .p.on{background:#a90b0c;border-color:#a90b0c;color:#f7f8fa}
  #wipe{position:absolute;left:0;right:0;height:300px;z-index:40;display:none}
  #cap{position:absolute;left:70px;right:70px;bottom:150px;display:flex;justify-content:center;z-index:30}
  /* captions: bold navy text straight on the paper (no box), a paper halo keeps them clean over the grid */
  #capb{color:#07293a;padding:10px 20px 14px;font-weight:700;font-size:70px;line-height:1.14;text-align:center;max-width:940px;box-sizing:border-box;
    text-shadow:0 0 6px #f7f8fa,0 0 12px #f7f8fa,0 0 18px #f7f8fa}
  #capb .w{display:inline-block}
  #capb .rd{color:#a90b0c}
  #end{position:absolute;inset:0;background:#07293a;display:none;z-index:35}
  #cover{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:38;display:none}
  #sheetno{position:absolute;left:84px;top:66px;font-weight:700;font-size:30px;color:#8fb6c8;direction:rtl;z-index:2}
  svg{overflow:visible}
  svg text{font-family:Almoni;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <svg id="sheet" width="1080" height="1920"></svg>
  <div id="sheetno"></div>
  <div id="legend"><span class="b">בנייה</span><span class="p">פיקוח</span></div>
  <div class="sc" id="world"></div>
  <div id="cap"><div id="capb"></div></div>
  <div id="cta">דברו איתנו<b>055-981-1814</b></div>
  <div id="end"></div>
  <img id="cover" src="cover.png" alt="">
  <svg id="wipe" width="1080" height="300"></svg>
  <canvas id="grain" width="540" height="960"></canvas>
</div>
<script src="voice/timings.js"></script>
<script src="../lib/studio.js"></script>
<script>
const W = 1080, H = 1920;
const NAVY = '#07293a', TEAL = '#105572', MIST = '#8fb6c8', PAPER = '#f7f8fa', RED = '#a90b0c', LINE = '#c9d6de', CONC = '#9fb1bb';
const {clamp, lerp, smooth} = Studio;
const $ = id => document.getElementById(id);
const q = s => [...document.querySelectorAll(s)];
const L = window.VT.lines;                       // [{i, a, b, cap}] voice seconds
const CUT = L.map(x => Math.max(0, x.a - .2));   // every scene cuts in just before its line
CUT[0] = window.VT.cover || 0;                    // the cover frame (cover.png) holds until the first cut
const NS = L.length - 1;                          // scenes before the end card
const END = CUT[NS], DUR = +(window.VT.voice + 1.1).toFixed(2);
const SID = L.map(x => x.i - 1);                  // the scene of each line (scenes are numbered by line)
const CTA_AT = CUT[L.findIndex(x => x.i === 10)]; // the phone strip from the middle on (right after Shlomi's full height photo)
// which side each line shows in the legend: b construction, p supervision, bp both
const SIDE = {1: 'b', 2: 'p', 3: 'p', 4: 'b', 5: 'p', 6: 'bp', 7: 'p', 8: 'bp', 9: '', 10: 'bp', 11: 'bp', 12: 'bp', 13: 'p'};

// ---------- easing: entries ease out (expo, or back for things that land), exits are faster and ease in ----------
const P = (u, a, d) => clamp((u - a) / d);
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const quadIn = x => x * x;
const E = (u, a, d) => expo(P(u, a, d));         // 0 -> 1 from a, over d seconds
const B = (u, a, d) => back(P(u, a, d));
const vis = (el, on) => { el.style.display = on ? 'block' : 'none'; return on; };
// a whole word or label rises into place (never revealed behind a mask: half a Hebrew word reads like dashes)
function rise(el, u, a, d, dy) { const p = E(u, a, d || .5); el.style.opacity = clamp(p * 1.4); el.style.transform = `translateY(${(1 - p) * (dy == null ? 34 : dy)}px)`; return p; }
const draw = (el, p) => { el.style.strokeDashoffset = 1 - clamp(p); };
const panel = (el, p) => { draw(el, p); el.style.fillOpacity = clamp(p * 1.6); };   // an outlined panel: its fill arrives with its outline
// an SVG thing lands: scale with a back-out overshoot around its own centre
const land = (el, s, rot) => { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; el.style.transform = `scale(${Math.max(0, s)})${rot ? ` rotate(${rot}deg)` : ''}`; el.style.opacity = clamp(s * 3); };
const landEl = (el, s, origin) => { el.style.transformOrigin = origin || '50% 50%'; el.style.transform = `scale(${Math.max(0, s)})`; el.style.opacity = clamp(s * 3); };
// drops into place from above, back-out
const drop = (el, u, a, d, dy) => { const p = P(u, a, d || .45); el.style.transform = `translateY(${(1 - back(p)) * -(dy || 140)}px)`; el.style.opacity = clamp(p * 4); };

// ---------- the drawing sheet: a faint grid, a frame, registration corners ----------
$('sheet').innerHTML = (() => { let s = ''; for (let x = 60; x <= 1020; x += 60) s += `<line x1="${x}" y1="60" x2="${x}" y2="1860" stroke="${LINE}" stroke-width="${x % 300 === 0 ? 2 : 1}" opacity=".55"/>`;
  for (let y = 60; y <= 1860; y += 60) s += `<line x1="60" y1="${y}" x2="1020" y2="${y}" stroke="${LINE}" stroke-width="${y % 300 === 0 ? 2 : 1}" opacity=".55"/>`;
  s += `<rect x="40" y="40" width="1000" height="1840" fill="none" stroke="${MIST}" stroke-width="4"/>`;
  [[40, 40, 1, 1], [1040, 40, -1, 1], [40, 1880, 1, -1], [1040, 1880, -1, -1]].forEach(([x, y, a, b]) => s += `<path d="M${x} ${y + b * 80} V${y} H${x + a * 80}" fill="none" stroke="${NAVY}" stroke-width="8"/>`);
  return s; })();
// the wipe: a mist scale ruler with teal ticks (mist, not navy, and linear, so the sweep stays under the flash limit)
$('wipe').innerHTML = `<rect width="1080" height="300" fill="${MIST}"/>` + Array.from({length: 55}, (_, i) => `<path d="M${20 + i * 19.6} 0 V${i % 10 === 0 ? 90 : i % 5 === 0 ? 60 : 34}" stroke="${TEAL}" stroke-width="4"/>`).join('') +
  `<rect y="292" width="1080" height="8" fill="${RED}"/>`;

// ---------- captions (from timings.js; ~ marks a red word, | splits a line into parts) ----------
const CAPS = [];
L.forEach(x => { if (!x.cap) return; const parts = x.cap.split('|'), tot = parts.reduce((n, p) => n + p.length, 0); let a = x.a;
  parts.forEach(p => { const b = a + (x.b - x.a) * p.length / tot; CAPS.push([a - .05, b + (p === parts[parts.length - 1] ? .25 : 0), p]); a = b; }); });
CAPS.forEach(c => { c.html = c[2].split(' ').map(w => w[0] === '~' ? `<span class="w rd">${w.slice(1)}</span>` : `<span class="w">${w}</span>`).join(' '); });
let capCur = -1;
function caption(t) {
  const i = CAPS.findIndex(c => t >= c[0] && t < c[1]), box = $('cap');
  if (i < 0 || t >= END) { box.style.opacity = 0; capCur = -1; return; }
  const c = CAPS[i]; if (capCur !== i) { $('capb').innerHTML = c.html; capCur = i; }
  box.style.opacity = Math.min(E(t, c[0], .2), 1 - quadIn(P(t, c[1] - .12, .12)));
  box.style.transform = `translateY(${(1 - E(t, c[0], .35)) * 24}px)`;
  const ws = $('capb').children, n = ws.length, span = Math.min(.9, (c[1] - c[0]) * .45);
  for (let j = 0; j < n; j++) { const a = c[0] + .05 + span * j / n, p = E(t, a, .3); ws[j].style.opacity = .2 + .8 * p; ws[j].style.transform = `translateY(${(1 - p) * 12}px)`; }
}

// ---------- scenes ----------
const SC = [];
function scene(html) { const d = document.createElement('div'); d.className = 'sc'; d.innerHTML = `<div class="cam">${html}</div>`; $('world').appendChild(d); SC.push(d); return d; }
const svg = inner => `<svg width="1080" height="1920" class="abs">${inner}</svg>`;
const hdr = (id, n, title, sub) => `<div class="hdr" id="${id}"><div class="mk"><b>${String(n).padStart(2, '0')}</b><i>פיקוח</i></div><div class="tt">${sub ? `<small>${sub}</small>` : ''}<span>${title}</span></div></div>`;
const hatch = (id, col) => `<pattern id="${id}" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V22" stroke="${col}" stroke-width="5"/></pattern>`;
const DL = 'pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"';   // a path that draws itself
const tick = (x, y, s, col, cls) => `<path class="${cls || ''}" d="M${x - 22 * s} ${y} L${x - 6 * s} ${y + 16 * s} L${x + 24 * s} ${y - 18 * s}" fill="none" stroke="${col}" stroke-width="${11 * s}" stroke-linecap="round" stroke-linejoin="round" ${DL}/>`;
const ring = (cls, cx, cy, r, w) => `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${RED}" stroke-width="${w || 7}" ${DL} transform="rotate(-90 ${cx} ${cy})"/>`;
const lens = (id, r, cls) => `<g id="${id}" class="${cls == null ? 'ln' : cls}"><circle r="${r}" fill="#ffffff55" stroke="${RED}" stroke-width="${r / 8}"/><path d="M${r * .7} ${r * .7} L${r * 1.5} ${r * 1.5}" stroke="${RED}" stroke-width="${r / 4}" stroke-linecap="round"/></g>`;

// 1 · build a private house? the mistakes vanish within days (construction: the house draws itself floor by floor)
scene(`<div class="big" id="s1t" style="top:300px;font-size:124px">בונים בית פרטי?</div>
  ${svg(`<defs>${hatch('h1', MIST)}</defs>
   <image class="ln" id="s1g" href="kurkoos-logo-h.svg" x="360" y="150" width="360" height="90"/>
   <g class="ln" id="s1h">
    <path class="s1p" data-a=".05" data-d=".45" d="M130 1180 H950" stroke="${NAVY}" stroke-width="10" fill="none" ${DL}/>
    <rect x="270" y="1180" width="540" height="130" fill="url(#h1)" stroke="${NAVY}" stroke-width="8" id="s1f"/>
    ${[350, 540, 730].map(x => `<g transform="translate(${x} 1245)"><g class="s1d"><circle r="30" fill="none" stroke="${RED}" stroke-width="8" stroke-dasharray="10 8"/><circle r="9" fill="${RED}"/></g></g>`).join('')}
    <rect id="s1c" x="266" y="1314" width="548" height="0" fill="${CONC}"/>
    <path class="s1p" data-a=".35" data-d=".45" d="M300 1180 V990 M780 1180 V990" stroke="${NAVY}" stroke-width="14" fill="none" ${DL}/>
    <path class="s1p" data-a=".7" data-d=".35" d="M290 990 H790" stroke="${NAVY}" stroke-width="12" fill="none" ${DL}/>
    <path class="s1p" data-a=".95" data-d=".45" d="M300 990 V800 M780 990 V800" stroke="${NAVY}" stroke-width="14" fill="none" ${DL}/>
    <path class="s1p" data-a="1.3" data-d=".5" d="M250 822 L540 600 L830 822" stroke="${NAVY}" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none" ${DL}/>
    <path class="s1p" data-a="1.0" data-d=".4" d="M380 1180 V1040 H480 V1180" stroke="${TEAL}" stroke-width="6" fill="none" ${DL}/>
    <path class="s1p" data-a="1.45" data-d=".4" d="M590 860 H710 V950 H590 Z" stroke="${TEAL}" stroke-width="6" fill="none" ${DL}/></g>`)}
  <div class="chip r" id="s1k" style="left:110px;top:1370px">תוך ימים</div>`);

// 2 · three hidden mistakes, three detail cards (each drawing draws itself, then supervision rings the fault)
const card = (i, y, title, sub, drawing, rg) => `<g class="s2c" id="s2c${i}"><rect class="s2o" x="100" y="${y}" width="880" height="300" rx="22" fill="#fff" stroke="${NAVY}" stroke-width="6" ${DL}/>
   <g class="ln">${drawing}${rg}</g>
   <text class="s2a" x="930" y="${y + 130}" font-size="70" fill="${RED}">${title}</text><text class="s2b" x="930" y="${y + 205}" font-size="46" fill="${NAVY}">${sub}</text></g>`;
scene(svg(`<defs>${hatch('h2', MIST)}</defs>` +
  card(0, 320, 'ברזל', 'שלא לפי התוכנית', `<path class="s2d" d="M170 370 H460 V570 H170 Z" fill="none" stroke="${NAVY}" stroke-width="8" ${DL}/><path class="s2d" d="M206 396 H424 Q434 396 434 406 V534 Q434 544 424 544 H206 Q196 544 196 534 V406 Q196 396 206 396 Z" fill="none" stroke="${TEAL}" stroke-width="5" ${DL}/>
     ${[[220, 420, 13], [410, 420, 13], [220, 520, 15], [283, 520, 15], [410, 520, 15]].map(([x, y, r]) => `<circle class="s2e" cx="${x}" cy="${y}" r="${r}" fill="${NAVY}"/>`).join('')}
     <circle class="s2e" cx="347" cy="520" r="24" fill="none" stroke="${RED}" stroke-width="6" stroke-dasharray="8 7"/>`, ring('s2r', 347, 520, 50)) +
  card(1, 660, 'שרוול', 'שנשכח בתקרה', `<path class="s2d" d="M150 770 H480 V850 H150 Z" fill="url(#h2)" stroke="${NAVY}" stroke-width="8" ${DL}/>
     <path class="s2d" d="M310 690 V760 M310 860 V930" stroke="${TEAL}" stroke-width="16" stroke-linecap="round" fill="none" ${DL}/>
     <circle class="s2e" cx="310" cy="810" r="42" fill="none" stroke="${RED}" stroke-width="6" stroke-dasharray="10 8"/>`, ring('s2r', 310, 810, 66)) +
  card(2, 1000, 'איטום', 'בלי בדיקת הצפה', `<path class="s2d" d="M150 1200 H480" stroke="${NAVY}" stroke-width="10" fill="none" ${DL}/><path class="s2e" d="M150 1222 H480" stroke="${RED}" stroke-width="7" stroke-dasharray="16 10"/>
     <path class="s2d" d="M160 1150 q25 -22 50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="${TEAL}" stroke-width="7" ${DL}/>
     <path class="s2e" d="M300 1060 q-24 34 0 46 q24 -12 0 -46 Z" fill="${TEAL}"/><path class="s2e" d="M380 1080 q-18 26 0 34 q18 -8 0 -34 Z" fill="${TEAL}"/>`, `<path class="s2r" d="M140 1240 H490" stroke="${RED}" stroke-width="8" fill="none" ${DL}/>`)));

// 3 · cheap while visible, very expensive after the concrete (blocks stack up)
const BLK = 64;
scene(hdr('s3h', 3, 'מחיר התיקון') + svg(`<defs>${hatch('h3', '#ffffff55')}</defs>
  <path class="ln s3l" d="M120 1250 H960" stroke="${NAVY}" stroke-width="10" stroke-linecap="round" fill="none" ${DL}/>
  <g class="ln">${[0, 1].map(i => `<rect class="s3a" x="645" y="${1250 - (i + 1) * BLK + 4}" width="210" height="${BLK - 8}" rx="8" fill="${NAVY}"/>`).join('')}</g>
  <g class="ln">${Array.from({length: 9}, (_, i) => `<rect class="s3b" x="225" y="${1250 - (i + 1) * BLK + 4}" width="210" height="${BLK - 8}" rx="8" fill="${RED}"/>`).join('')}
   <rect id="s3c" x="225" y="${1250 - 9 * BLK}" width="210" height="${9 * BLK}" fill="url(#h3)"/></g>`) +
  `<div class="lbl" id="s3at" style="left:640px;width:220px;text-align:center;top:990px;font-size:76px">זול</div>
   <div class="lbl" id="s3bt" style="left:150px;width:360px;text-align:center;top:560px;font-size:76px;color:${RED}">יקר מאוד</div>
   <div class="lbl s3u" style="left:590px;width:320px;text-align:center;top:1290px;font-size:46px;color:${TEAL}">כשהיא גלויה</div>
   <div class="lbl s3u" style="left:150px;width:360px;text-align:center;top:1290px;font-size:46px;color:${TEAL}">אחרי הבטון</div>`);

// 4 · split: the contractor builds, and no inspector of yours checks it
scene(`<div class="chip" id="s4a" style="right:110px;top:260px">הקבלן בונה</div><div class="chip d" id="s4b" style="left:110px;top:260px">בלי מפקח</div>` + svg(`
  <path class="ln" id="s4m" d="M540 400 V1280" stroke="${MIST}" stroke-width="6" stroke-dasharray="14 12" fill="none"/>
  <g class="ln">${Array.from({length: 5}, (_, i) => `<g class="s4f"><rect x="600" y="${1250 - (i + 1) * 130 + 6}" width="340" height="118" rx="6" fill="${i % 2 ? TEAL : NAVY}"/>
     ${[0, 1, 2].map(j => `<rect x="${630 + j * 104}" y="${1250 - (i + 1) * 130 + 40}" width="72" height="48" rx="4" fill="${PAPER}" opacity=".85"/>`).join('')}</g>`).join('')}

    $('s7m').setAttribute('transform', `translate(${lerp(140, 540, E(u, 2.15, .7))} 0)`); $('s7m').style.opacity = E(u, 2.15, .2); }
  if (n === 7) { draw(S.querySelector('.s8g'), E(u, 0, .4)); panel(S.querySelector('.s8o'), E(u, .05, .6)); rise($('s8h'), u, .2, .45, 18);
    $$('.s8f').forEach((e, i) => drop(e, u, .25 + i * .3, .4, 160)); draw($('s8roof'), E(u, 1.45, .45));
    $$('.s8k').forEach((e, i) => draw(e, E(u, .45 + i * .3, .3))); landEl($('s8c'), B(u, 1.8, .45)); }
  if (n === 8) { const f = E(u, 0, .5); $('s9p').style.opacity = f; const z = 1.1 - .1 * f + .06 * smooth(u / 5.5);
    $('s9i').setAttribute('transform', `translate(540 800) scale(${z}) translate(-540 -800)`); draw($('s9o'), E(u, .1, 1.1));
    rise($('s9a'), u, .6, .5, 20); rise($('s9n'), u, 1.5, .6, 30); land($('s9r'), B(u, 2.3, .45)); }
  if (n === 9) { rise($('s10t'), u, 0, .5, 40); $$('.s10b').forEach((g, i) => { const p = P(u, .1 + i * .12, .5); g.style.opacity = clamp(p * 4); g.style.transform = `translateY(${(1 - back(p)) * 160}px)`; });
    draw($('s10r'), E(u, .65, .55)); rise($('s10u'), u, .85, .45, 20); }
  if (n === 10) { const at = [0, .95, 1.8, 2.75]; $$('.s11r').forEach((g, i) => { const p = E(u, at[i], .55); g.style.opacity = clamp(p * 2); g.style.transform = `translateX(${(1 - p) * 110}px)`; });
    draw($('s11k'), E(u, 2.2, .5)); land($('s11n'), B(u, 2.6, .4)); draw(S.querySelector('.s11t'), E(u, 2.75, .25)); }
  if (n === 11) { rise($('s12t'), u, 0, .5, 30); const p = E(u, .25, 2.4); draw($('s12p'), p);
    R12.forEach((r, i) => { const at = .25 + 2.4 * r.f * .62; land(S.querySelectorAll('.s12d')[i], B(u, at, .35));
      const bl = S.querySelectorAll('.s12b')[i], bp = P(u, at + .1, .4); bl.style.transformBox = 'fill-box'; bl.style.transformOrigin = '50% 100%'; bl.style.transform = `scaleY(${back(bp)})`; bl.style.opacity = clamp(bp * 4);
      land(S.querySelectorAll('.s12c')[i], B(u, at + .35, .35)); draw(S.querySelectorAll('.s12k')[i], E(u, at + .45, .25)); });
    $('s12e').style.opacity = .35 + .65 * E(u, 2.2, .3); }
  if (n === 12) { rise($('s13t'), u, 0, .5, 40); panel(S.querySelector('.s13o'), E(u, .05, .55)); rise($('s13h'), u, .2, .4, 18); rise($('s13s'), u, .4, .4, 10);
    $$('.s13r').forEach((e, i) => { const p = E(u, .25 + i * .07, .4); e.style.opacity = clamp(p * 2); e.style.transform = `translateX(${(1 - p) * 30}px)`; });
    const pe = E(u, .3, .9), back2 = quadIn(P(u, 1.4, .3)); $('s13pen').setAttribute('transform', `translate(${lerp(-200, 330, pe) - 60 * back2} ${lerp(1300, 1080, pe) + 40 * back2})`);
    landEl($('s13c'), B(u, 1.05, .45)); }
}

// ---------- the camera of every scene: a gentle push in, and a soft zoom step at every caption part ----------
const BEATS = L.map((x, m) => { const a = CUT[m], e = CUT[m + 1] || DUR; return CAPS.filter(c => c[0] > a + .5 && c[0] < e - .5).map(c => c[0] - a); });
function camera(m, u, len) {
  const keys = [[0, 0]].concat(BEATS[m].map((b, i) => [b, i % 2 ? 0 : 1]));
  const z = Studio.track(u, keys, {f: 2.6, z: .9});
  const cam = SC[SID[m]].firstElementChild;
  cam.style.transformOrigin = '50% 42%';
  cam.style.transform = `scale(${1.03 - .03 * E(u, 0, .5) + .018 * smooth(u / len) + .016 * z})`;
}
// match cuts: the camera zooms through a point of the old scene into the new one (index = the line the cut goes into)
const ZOOM = {1: [540, 1245], 4: [320, 925], 10: [540, 1030]};
const H2 = .17, HZ = .22;
function show(m, t, y0, y1, zoom) {                // the scene of line m, visible between y0 and y1 (stage pixels)
  const d = SC[SID[m]], u = t - CUT[m], len = (CUT[m + 1] || DUR) - CUT[m];
  vis(d, true); d.style.clipPath = y0 <= 0 && y1 >= 1920 ? 'none' : `inset(${Math.max(0, y0)}px 0 ${Math.max(0, 1920 - y1)}px 0)`; d.dataset.y0 = y0; d.dataset.y1 = y1;
  d.style.opacity = zoom ? zoom.o : 1; d.style.visibility = zoom && zoom.o < .002 ? 'hidden' : ''; d.style.transform = zoom ? `scale(${zoom.s})` : 'none'; d.style.transformOrigin = zoom ? `${zoom.f[0]}px ${zoom.f[1]}px` : '50% 50%';
  d.dataset.leaving = zoom && zoom.out ? '1' : '';
  camera(m, u, len); anim(SID[m], u, len);
  // anything faded out to 0 is hidden, not drawn at opacity 0: Chromium's software renderer reuses the surface of a same-size
  // sibling for an invisible opacity group (the three equal cards of scene 2 showed a cut copy of card 1 in card 3's slot)
  d.querySelectorAll('[style*="opacity"]').forEach(el => { el.style.visibility = +el.style.opacity < .002 ? 'hidden' : ''; });
}
function seek(t) {
  const n = CUT.filter(c => c <= t).length - 1;        // current line 0..NS, -1 on the cover
  SC.forEach(s => vis(s, false));
  let j = -1; for (let i = 0; i < NS; i++) if ((i > 0 || CUT[0] > 0) && Math.abs(t - CUT[i]) < (ZOOM[i] ? HZ : H2)) j = i;
  let yb = -400;
  if (j >= 0 && ZOOM[j]) {                            // zoom through: the old scene pushes in and fades, the new one settles from a closer view
    const p = (t - CUT[j] + HZ) / (2 * HZ), f = ZOOM[j];
    show(j - 1, t, -1, 2000, {s: 1 + 1.4 * quadIn(p), o: 1 - smooth(p), f, out: true});
    show(j, t, -1, 2000, {s: 1.35 - .35 * expo(p), o: smooth(p), f});
  } else if (j >= 0) {                                // the ruler wipe: above it the new scene, below it the old one
    const p = (t - CUT[j] + H2) / (2 * H2); yb = lerp(-300, 1920, p);
    show(j, t, -1, yb); if (j > 0) show(j - 1, t, yb + 300, 2000);
  } else if (n >= 0 && n < NS) show(n, t, -1, 2000);
  vis($('wipe'), j >= 0 && !ZOOM[j]); $('wipe').style.top = yb + 'px';
  const coverOn = n < 0 || j === 0; vis($('cover'), coverOn); $('cover').style.clipPath = j === 0 ? `inset(${yb + 300}px 0 0 0)` : 'none';
  const ctaOn = t >= CTA_AT && t < END; vis($('cta'), ctaOn); $('cta').style.transform = `translateY(${(1 - E(t, CTA_AT, .5)) * -90}px)`;
  const m = Math.max(0, Math.min(n, NS - 1)), side = SIDE[L[j >= 0 ? j : m].i] || '';
  $('legend').style.display = n >= 0 && t < END && side ? 'flex' : 'none';
  $('legend').querySelector('.b').classList.toggle('on', side.includes('b')); $('legend').querySelector('.p').classList.toggle('on', side.includes('p'));
  $('sheetno').textContent = n >= 0 && n < NS && !ctaOn ? `גיליון ${String(n + 1).padStart(2, '0')}/${NS}` : '';
  const u = t - CUT[m], len = (CUT[m + 1] || DUR) - CUT[m];
  $('sheet').style.transform = `scale(${1 + .012 * smooth(u / len)}) translateY(${-10 * smooth(u / len)}px)`;
  // the end card drops in from the top like a sheet laid on the table
  const e = clamp((t - END) / .9); vis($('end'), t >= END); $('end').style.clipPath = `inset(0 0 ${(1 - e) * 100}% 0)`;
  rise($('e0'), t - END, .35, .6, 30); ['e1', 'e2', 'e3', 'e4', 'e5'].forEach((id, i) => rise($(id), t - END, .5 + i * .16, .6, 30));
  caption(t);
}

// geometry check on every frame: text on text, text on line work (with about 1 cm clearance), anything under the caption, anything cut off
function check(t) {
  const out = [], cap = $('cap').getBoundingClientRect();
  if (+$('cap').style.opacity > .5 && (cap.top < 0 || cap.bottom > 1840)) out.push('caption outside safe area');
  if ($('capb').getBoundingClientRect().height > 260) out.push('caption taller than 3 lines');
  if (+$('cap').style.opacity > .5 && $('cover').style.display !== 'none' && $('cover').style.clipPath === 'none') out.push('caption over the cover');
  const shown = e => { let o = 1; for (let x = e; x && x !== document.body; x = x.parentElement) { const cs = getComputedStyle(x); if (cs.display === 'none' || cs.visibility === 'hidden') return false; o *= +cs.opacity; } return o > .5; };
  const tight = e => { if (e instanceof SVGElement) return e.getBoundingClientRect(); const pill = e.querySelector('span[style*="padding"]'); if (pill) return pill.getBoundingClientRect(); if (e.classList.contains('chip') || e.classList.contains('hdr')) return e.getBoundingClientRect(); const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect(); };
  const inView = ([e, r]) => { const d = e.closest('.sc'); return !d || (d.dataset.leaving !== '1' && r.bottom > +d.dataset.y0 && r.top < +d.dataset.y1); };
  const T = [...document.querySelectorAll('#world .sc text, #world .sc .lbl, #world .sc .chip, #world .sc .big, #world .sc .hdr')].filter(shown).map(e => [e, tight(e)]).filter(([, r]) => r.width > 0).filter(inView);
  // the box of line work is the union of its visible drawn parts (a part scaled to 0 would otherwise pull the box to the origin)
  const leaf = e => { if (!(e instanceof SVGGElement)) { const r = e.getBoundingClientRect(); const cs = getComputedStyle(e); return (r.width > 0 || r.height > 0) && +cs.opacity > .05 && cs.visibility !== 'hidden' ? [r] : []; } return [...e.children].flatMap(leaf); };
  const uni = rs => rs.length ? rs.reduce((a, b) => ({left: Math.min(a.left, b.left), top: Math.min(a.top, b.top), right: Math.max(a.right, b.right), bottom: Math.max(a.bottom, b.bottom)})) : null;
  const Ln = [...document.querySelectorAll('#world .sc .ln')].filter(shown).map(e => [e, uni(leaf(e))]).filter(([, r]) => r && r.right > r.left).filter(inView);
  // a scene cut by the wipe only shows between y0 and y1: every box is cut to that band
  const cutTo = ([e, r]) => { const d = e.closest('.sc'); if (!d) return [e, r]; return [e, {left: r.left, right: r.right, top: Math.max(r.top, +d.dataset.y0), bottom: Math.min(r.bottom, +d.dataset.y1)}]; };
  T.splice(0, T.length, ...T.map(cutTo)); Ln.splice(0, Ln.length, ...Ln.map(cutTo));
  const same = (a, b) => a.closest('.sc') === b.closest('.sc');
  const hit = (a, b, m) => a.left < b.right + m && b.left < a.right + m && a.top < b.bottom + m && b.top < a.bottom + m;
  const nm = e => (e.textContent || e.id || e.tagName).trim().slice(0, 18);
  for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++) { const [a, ra] = T[i], [b, rb] = T[j]; if (a.contains(b) || b.contains(a) || !same(a, b)) continue; if (hit(ra, rb, 12)) out.push('text on text: ' + nm(a) + ' / ' + nm(b)); }
  T.forEach(([a, ra]) => Ln.forEach(([b, rb]) => { if (a.contains(b) || b.contains(a) || !same(a, b)) return; if (hit(ra, rb, 24)) out.push('text on lines: ' + nm(a) + ' / ' + nm(b)); }));
  T.forEach(([a, r]) => { if (r.left < 50 || r.right > 1030 || r.top < 150) out.push('cut off: ' + nm(a)); });
  ['cta', 'legend'].forEach(id => { if ($(id).style.display === 'none') return; const rc = $(id).getBoundingClientRect(); T.concat(Ln).forEach(([e, r]) => { if (hit(r, rc, 16)) out.push('under the ' + id + ': ' + nm(e)); }); });
  if ($('cta').style.display !== 'none' && $('legend').style.display !== 'none' && hit($('cta').getBoundingClientRect(), $('legend').getBoundingClientRect(), 12)) out.push('phone strip on the legend');
  if (+$('cap').style.opacity > .5) { const rc = $('capb').getBoundingClientRect(); T.concat(Ln).forEach(([e, r]) => { if (hit(r, rc, 50)) out.push('under caption: ' + nm(e)); }); }
  if (t >= END + .8) { const els = [...document.querySelectorAll('#end .big')].map(e => tight(e)); for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) if (hit(els[i], els[j], 12)) out.push('end card overlap'); }
  return [...new Set(out)];
}

Studio.define({
  w: W, h: H, duration: DUR,
  stages: L.map((x, i) => ({t: +(Math.min((CUT[i + 1] || DUR) - .25, CUT[i] + 3.0)).toFixed(2), label: 'line ' + x.i})).concat([{t: +(DUR - .4).toFixed(2), label: 'end'}]),
  fonts: ['700 60px Almoni', '400 60px Almoni'],
  seek, check,
});
