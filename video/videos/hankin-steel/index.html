      #r-img { width: 1080px; height: 608px; object-fit: cover; display: block; transform-origin: 50% 60%; }

      #e-wrap { position: absolute; left: 110px; top: 690px; width: 860px; height: 390px; overflow: hidden; }

    </style>

  <body>

    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      // every cut lands with a short push in that settles, so the footage hits the beat
      function punch(i, t, d) {
        tl.fromTo("#w" + i, { scale: 1.14 }, { scale: 1.0, duration: 0.28, ease: "expo.out", immediateRender: false }, t);
        tl.to("#w" + i, { scale: 1.04, duration: Math.max(0.1, d - 0.28), ease: "none" }, t + 0.28);
      }
      // a word block slams in: big, tilted, then locks
      const slam = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 1.7, rotation: -5, x: -40 }, { opacity: 1, scale: 1, rotation: 0, x: 0, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
      const flash = t => tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
      tl.set("#flash", { opacity: 0 }, 0);
      // the red edge bar pulses on the downbeats
      for (let k = 0; k * 0.46875 < 15.9375; k++) if (k % 4 === 0 && k * 0.46875 >= 1.875) tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.9375, ease: "expo.out", immediateRender: false }, k * 0.46875);
      tl.set("#bar", { scaleY: 0 }, 0);
            punch(0, 0.0, 1.875);
      punch(1, 1.875, 0.9375);
      punch(2, 2.8125, 0.9375);
      punch(3, 3.75, 0.9375);
      punch(4, 4.6875, 0.9375);
      punch(5, 5.625, 0.9375);
      punch(6, 6.5625, 0.9375);
      punch(7, 7.5, 0.9375);
      punch(8, 8.4375, 0.9375);
      punch(9, 9.375, 0.9375);
      punch(10, 10.3125, 0.9375);
      punch(11, 11.25, 0.9375);
      punch(12, 12.1875, 0.9375);
      punch(13, 13.125, 0.9375);
      punch(14, 14.0625, 1.875);
      slam("#title0", 0.15);
      slam("#title1", 0.4688);
      tl.to(["#title0", "#title1"], { opacity: 0, x: 140, duration: 0.14, ease: "power3.in", immediateRender: false }, 1.735);
      slam("#steel0", 1.955);
      slam("#steel1", 2.3438);
      flash(1.875);
      tl.to(["#steel0", "#steel1"], { opacity: 0, x: 140, duration: 0.14, ease: "power3.in", immediateRender: false }, 6.4225);
      slam("#floor0", 6.6425);
      slam("#floor1", 7.0312);
      flash(6.5625);
      tl.to(["#floor0", "#floor1"], { opacity: 0, x: 140, duration: 0.14, ease: "power3.in", immediateRender: false }, 13.9225);
      slam("#line0", 14.1425);
      slam("#line1", 14.5312);
      flash(14.0625);
      tl.to(["#line0", "#line1"], { opacity: 0, x: 140, duration: 0.14, ease: "power3.in", immediateRender: false }, 15.7975);
      // render card: the picture wipes up under the red bar and pushes in slowly, the title slams
      tl.fromTo("#r-frame", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.5, ease: "power3.inOut" }, 15.9375);
      tl.fromTo("#r-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 15.9375);
      tl.fromTo("#r-img", { scale: 1.0 }, { scale: 1.09, duration: 1.875, ease: "none" }, 15.9375);
      tl.fromTo("#r-a", { opacity: 0, scale: 1.6, rotation: -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 16.0375);
      tl.fromTo("#r-b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, 16.4062);
      tl.to(["#r-a", "#r-b"], { opacity: 0, duration: 0.14, ease: "power3.in", immediateRender: false }, 17.6725);
      tl.to("#r-frame", { clipPath: "inset(0 0 100% 0)", duration: 0.2, ease: "power3.in", immediateRender: false }, 17.6125);
      // logo card: the logo draws in from the right, the brand line and the site settle under it
      tl.fromTo("#e-wrap", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.8, ease: "power3.inOut" }, 17.8625);
      tl.fromTo("#e-b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, 18.7125);
      tl.fromTo("#e-site", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 18.9625);
      tl.fromTo("#logo", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 15.9375);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
