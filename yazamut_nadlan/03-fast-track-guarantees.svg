<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="מסלול תכנון מהיר ומגן ערבות - האצת התחדשות עירונית">
<!-- KURKOOS PALETTE: ink #16202E | paper #F5F2EC | brass #C9A24B | stone #9A9486 | line #2C3A4D -->
<rect width="1600" height="900" fill="#16202E"/>
<g stroke="#2C3A4D" stroke-width="1" opacity="0.16">
<line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="750" x2="1600" y2="750"/>
<line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/><line x1="1400" y1="0" x2="1400" y2="900"/>
</g>
<!-- slow track -->
<g opacity="0.4">
<line x1="150" y1="300" x2="1450" y2="300" stroke="#9A9486" stroke-width="6" stroke-dasharray="2 16"/>
<text x="800" y="270" text-anchor="middle" fill="#9A9486" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="600" font-size="22">מסלול טורי · מספר שנים</text>
</g>
<!-- fast track -->
<line x1="150" y1="470" x2="1150" y2="470" stroke="#C9A24B" stroke-width="6"/>
<circle cx="300" cy="470" r="46" fill="#F5F2EC"/><text x="300" y="478" text-anchor="middle" fill="#16202E" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="19">תכנון</text>
<circle cx="650" cy="470" r="46" fill="#F5F2EC"/><text x="650" y="478" text-anchor="middle" fill="#16202E" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="19">היתר</text>
<circle cx="1000" cy="470" r="46" fill="#F5F2EC"/><text x="1000" y="478" text-anchor="middle" fill="#16202E" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="19">אכלוס</text>
<polygon points="1150,470 1118,452 1118,488" fill="#C9A24B"/>
<rect x="455" y="520" width="340" height="64" rx="6" fill="#C9A24B"/>
<text x="625" y="563" text-anchor="middle" fill="#16202E" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" font-size="28">שנה וחצי לאישור</text>
<!-- shield -->
<g transform="translate(1330,470)">
<path d="M0 -110 L92 -72 L92 30 C92 96 48 132 0 150 C-48 132 -92 96 -92 30 L-92 -72 Z" fill="#F5F2EC"/>
<path d="M0 -110 L92 -72 L92 30 C92 96 48 132 0 150 C-48 132 -92 96 -92 30 L-92 -72 Z" fill="none" stroke="#C9A24B" stroke-width="6"/>
<path d="M-40 8 L-10 44 L52 -34" fill="none" stroke="#C9A24B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="0" y="120" text-anchor="middle" fill="#16202E" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" font-size="18">ערבות חוק המכר</text>
</g>
<text x="1330" y="700" text-anchor="middle" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="600" font-size="22">רפורמת הערבויות · תחרות חוץ-בנקאית</text>
<text x="1540" y="80" text-anchor="end" fill="#C9A24B" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="700" letter-spacing="2" font-size="26">רגולציה · תכנון · 2026</text>
<text x="1540" y="850" text-anchor="end" fill="#F5F2EC" font-family="Heebo,Assistant,Segoe UI,sans-serif" font-weight="800" letter-spacing="6" font-size="30">KURKOOS</text>
</svg>
